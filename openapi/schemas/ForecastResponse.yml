# Forecast reality-check API success response
ForecastResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    data:
      type: object
      description: >-
        Forecast built from the workspace's saved assumptions and the non-debt accounts in the
        workspace primary currency. The response does not name the currency. All amounts are
        numbers, not decimal strings. Planned, trajectory, interest and average values are rounded
        to whole units; actual balances, income and expenses are not.
      properties:
        assumptions:
          type: object
          description: Saved workspace forecast assumptions used to build the response.
          properties:
            monthlyTopup:
              type: number
              description: Monthly contribution in the primary currency
              example: 5000000
            annualRate:
              type: number
              description: Expected annual percentage yield, e.g. 7 for 7%
              example: 7
          required:
            - monthlyTopup
            - annualRate
        timeline:
          type: array
          description: >-
            One entry per month, from the earliest month with a recorded account balance through 24
            months after the latest one. Empty when no account has balance history.
          items:
            $ref: './ForecastTimelinePoint.yml#/ForecastTimelinePoint'
        chartWindow:
          type: object
          description: >-
            Default chart viewport: up to 12 months before and 24 months after the latest actual
            month, as indexes into `timeline`. With an empty timeline: `startIndex` 0, `endIndex`
            -1 and null keys.
          properties:
            startIndex:
              type: integer
              example: 0
            endIndex:
              type: integer
              example: 36
            startKey:
              type: string
              nullable: true
              example: '2025-03'
            endKey:
              type: string
              nullable: true
              example: '2028-03'
            latestActualKey:
              type: string
              nullable: true
              example: '2026-03'
          required:
            - startIndex
            - endIndex
            - startKey
            - endKey
            - latestActualKey
        yearlyBreakdown:
          type: array
          description: The timeline grouped by calendar year, oldest first.
          items:
            type: object
            properties:
              year:
                type: integer
                example: 2026
              yearLabel:
                type: string
                example: '2026'
              plannedEndingBalance:
                type: number
                nullable: true
                description: Planned balance of the year's last month in the timeline
                example: 2984000
              actualEndingBalance:
                type: number
                nullable: true
                description: Last non-null actual balance in the year, null when the year has none
                example: 1200000
              currentTrajectoryEndingBalance:
                type: number
                nullable: true
                description: Last non-null trajectory balance in the year, null when the year has none
                example: 1412000
              forecastInterestTotal:
                type: number
                example: 54000
              actualNetSavingsTotal:
                type: number
                nullable: true
                description: Sum of actual net savings for months with recorded actual data in that year.
                example: 600000
              months:
                type: array
                items:
                  $ref: './ForecastTimelinePoint.yml#/ForecastTimelinePoint'
            required:
              - year
              - yearLabel
              - plannedEndingBalance
              - actualEndingBalance
              - currentTrajectoryEndingBalance
              - forecastInterestTotal
              - actualNetSavingsTotal
              - months
        summary:
          type: object
          description: >-
            Fixed-horizon summary metrics. With no balance history every number is 0 and
            `latestActualKey` is null.
          properties:
            latestActualKey:
              type: string
              nullable: true
              example: '2026-03'
            latestActualBalance:
              type: number
              example: 1200000
            plannedEndingBalance:
              type: number
              description: Planned balance of the last timeline month
              example: 2984000
            currentTrajectoryEndingBalance:
              type: number
              description: Trajectory balance of the last timeline month
              example: 3126000
            totalForecastInterest:
              type: number
              example: 218000
            trailingAverageNetSavings:
              type: number
              description: Average net savings over the last 3 months up to the latest actual month
              example: 200000
          required:
            - latestActualKey
            - latestActualBalance
            - plannedEndingBalance
            - currentTrajectoryEndingBalance
            - totalForecastInterest
            - trailingAverageNetSavings
      required:
        - assumptions
        - timeline
        - chartWindow
        - yearlyBreakdown
        - summary
  required:
    - success
    - data
