# Base API Response Schema
ApiResponse:
  type: object
  properties:
    success:
      type: boolean
    data:
      description: Response data (present on success). An object or an array, depending on the operation.
    error:
      type: object
      description: Error details (present on failure)
      properties:
        message:
          type: string
        code:
          type: string
        details:
          description: Extra context whose shape depends on `code`. See ErrorResponse.
