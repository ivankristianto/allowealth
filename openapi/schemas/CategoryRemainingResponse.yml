# Category Remaining Response Schema
CategoryRemainingResponse:
  allOf:
    - $ref: './ApiErrorResponse.yml#/ApiResponse'
    - type: object
      required: [success, data]
      properties:
        data:
          type: object
          description: >-
            Budget and spending for one category in the current calendar month (server time) and
            the requested currency.
          required:
            [category_id, category_name, budget_amount, spent_amount, remaining, percentage_used]
          properties:
            category_id:
              type: string
              description: Category ID (nanoid)
            category_name:
              type: string
            budget_amount:
              type: string
              pattern: '^\d+(\.\d{1,2})?$'
              description: This month's budget, or `"0"` when no budget is set
            spent_amount:
              $ref: './BudgetSpentAmount.yml#/BudgetSpentAmount'
            remaining:
              type: string
              pattern: '^-?\d+(\.\d{1,2})?$'
              description: budget_amount minus spent_amount. Negative when overspent.
            percentage_used:
              type: string
              pattern: '^\d+(\.\d{2})?$'
              description: >-
                Spent as a percentage of budget_amount, as a string with 2 decimals (for example
                `"45.00"`). `"0"` when budget_amount is 0. Unlike the overview, this is a string.
