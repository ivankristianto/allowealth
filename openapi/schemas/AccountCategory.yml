# Account Category Schema
AccountCategory:
  type: object
  required:
    - id
    - name
    - description
    - isLiability
    - isSystem
    - sortOrder
    - accountCount
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
    name:
      type: string
    description:
      type: string
      nullable: true
      maxLength: 500
    isLiability:
      type: boolean
    isSystem:
      type: boolean
    sortOrder:
      type: integer
    accountCount:
      type: integer
      description: >-
        Number of active (not closed) accounts in this category. Create and update responses
        always send 0.
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
