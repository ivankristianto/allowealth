# Income report data - detailed income analysis
IncomeReportData:
  type: object
  properties:
    summary:
      type: object
      properties:
        totalIncome:
          type: string
          description: >-
            Total income for the period (decimal string). Narrowed by `user_id` when set; not
            narrowed by `source_type` or `category_id`.
          example: "13000000"
        activeIncome:
          type: string
          description: Total active income for the period
          example: "10000000"
        passiveIncome:
          type: string
          description: Total passive income for the period
          example: "2500000"
        otherIncome:
          type: string
          description: Total income classified as other (or unclassified) for the period
          example: "500000"
        growthVsPreviousPeriod:
          type: string
          description: >-
            Percentage change from the previous month (monthly) or previous year (yearly), rounded
            to 2 decimal places (decimal string). "100" when the previous period had no income and
            this one does, "0" when both are zero. Can be negative.
          example: "15.50"
        previousPeriodLabel:
          type: string
          description: Label of the previous period, "Mon YYYY" for monthly or "YYYY" for yearly
          example: "Feb 2026"
      required:
        - totalIncome
        - activeIncome
        - passiveIncome
        - otherIncome
        - growthVsPreviousPeriod
        - previousPeriodLabel
    sourceMix:
      type: array
      description: >-
        Income by category, sorted descending by value. Narrowed by `user_id` when set.
      items:
        type: object
        properties:
          name:
            type: string
            description: Income category name
          value:
            type: string
            description: Income amount for the category (decimal string)
          sourceType:
            type: string
            enum: [active, passive, other]
            description: Income source classification
        required:
          - name
          - value
          - sourceType
    sourceGroupTrend:
      type: array
      description: >-
        Income by source classification per month of the selected period: one row for the monthly
        range, 12 rows (January to December) for the yearly range.
      items:
        type: object
        properties:
          name:
            type: string
            description: Short English month label ("Jan" to "Dec")
          active:
            type: string
            description: Active income total for the period
          passive:
            type: string
            description: Passive income total for the period
          other:
            type: string
            description: Other income total for the period
        required:
          - name
          - active
          - passive
          - other
    members:
      type: array
      description: >-
        Per-member income totals for the selected period, sorted by total income descending. Covers
        the whole workspace even when `user_id` is set.
      items:
        type: object
        properties:
          userId:
            type: string
          userName:
            type: string
          totalIncome:
            type: string
          transactionCount:
            type: integer
        required:
          - userId
          - userName
          - totalIncome
          - transactionCount
    history:
      type: object
      description: >-
        Paginated income transactions, newest first. The only section narrowed by all three filters
        (`user_id`, `source_type`, `category_id`).
      properties:
        transactions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              description:
                type: string
                description: Transaction description, empty string when unset
              amount:
                type: string
                description: Transaction amount (decimal string)
              currency:
                type: string
                description: ISO 4217 code, always the requested currency
              transaction_date:
                type: string
                format: date-time
                description: ISO 8601 timestamp in UTC
              category_name:
                type: string
              category_icon:
                type: string
              category_color:
                type: string
              income_source_type:
                type: string
                enum: [active, passive, other]
              created_by_name:
                type: string
            required:
              - id
              - description
              - amount
              - currency
              - transaction_date
              - category_name
              - category_icon
              - category_color
              - income_source_type
              - created_by_name
        total:
          type: integer
          description: Number of matching transactions across all pages
        page:
          type: integer
          description: Page returned, after clamping to at least 1
        pageSize:
          type: integer
          description: Page size used, after clamping to 1..100
        appliedFilters:
          type: object
          description: >-
            Filters that were applied. A key is present only when its filter was valid and used;
            an ignored `source_type` or `category_id` is absent here.
          properties:
            userId:
              type: string
            sourceType:
              type: string
              enum: [active, passive, other]
            categoryId:
              type: string
      required:
        - transactions
        - total
        - page
        - pageSize
        - appliedFilters
  required:
    - summary
    - sourceMix
    - sourceGroupTrend
    - members
    - history
