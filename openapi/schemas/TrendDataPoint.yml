# Trend data point for financial velocity bar chart
TrendDataPoint:
  type: object
  properties:
    name:
      type: string
      description: Short English month label ("Jan" to "Dec"). Yearly reports also use month labels, one per month.
      example: "Feb"
    income:
      type: string
      description: Total income for the period (decimal string for precision)
      example: "9750000"
    expenses:
      type: string
      description: Total expenses for the period (decimal string for precision)
      example: "4735000"
  required:
    - name
    - income
    - expenses
