# Per-member totals row
MemberSummaryRow:
  type: object
  properties:
    userId:
      type: string
      description: ID of the user who created the transactions
      example: aBcD3fGh1jKlMn0pQrStU
    userName:
      type: string
      description: >-
        Member name, or email when the name is empty. "Unknown" when the user is deleted or no
        longer in the workspace.
      example: Alex Doe
    totalIncome:
      type: string
      description: Total income for the selected period (decimal string)
      example: "9750000"
    totalExpenses:
      type: string
      description: Total expenses for the selected period (decimal string)
      example: "4735000"
    netSavings:
      type: string
      description: Total income minus total expenses (decimal string, can be negative)
      example: "5015000"
    transactionCount:
      type: integer
      description: Number of income plus expense transactions in the period (transfers excluded)
      example: 42
  required:
    - userId
    - userName
    - totalIncome
    - totalExpenses
    - netSavings
    - transactionCount
