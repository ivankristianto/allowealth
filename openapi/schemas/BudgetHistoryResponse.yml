# Budget History Response Schema
BudgetHistoryResponse:
  allOf:
    - $ref: './ApiErrorResponse.yml#/ApiResponse'
    - type: object
      required: [success, data]
      properties:
        data:
          type: array
          description: >-
            One entry per month, newest first, starting with the current month. Months with no
            budgets are still listed, with zero totals.
          items:
            type: object
            required:
              [
                month,
                year,
                month_name,
                total_budget,
                total_spent,
                total_balance,
                categories_count,
                categories_exceeded,
                categories_warning,
                percentage_used,
              ]
            properties:
              month:
                type: integer
                minimum: 1
                maximum: 12
                description: Month number (1-12)
              year:
                type: integer
                description: Year
              month_name:
                type: string
                description: Full English month name (e.g., "January")
              total_budget:
                type: string
                pattern: '^\d+(\.\d{1,2})?$'
                description: Sum of budgets for active expense categories in the month
              total_spent:
                type: string
                pattern: '^\d+(\.\d{1,2})?$'
                description: Expense total in the month for those budgeted categories
              total_balance:
                type: string
                pattern: '^-?\d+(\.\d{1,2})?$'
                description: total_budget minus total_spent. Negative when overspent.
              categories_count:
                type: integer
                description: Number of budgets in the month whose category is an active expense category
              categories_exceeded:
                type: integer
                description: Number of those categories above 100% of budget
              categories_warning:
                type: integer
                description: Number of those categories at 80% to 100% of budget
              percentage_used:
                type: number
                description: total_spent as a percentage of total_budget, rounded to 2 decimals. 0 when total_budget is 0.
