# Error Response Schema
ErrorResponse:
  allOf:
    - $ref: './ApiErrorResponse.yml#/ApiResponse'
    - type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
            code:
              type: string
              description: >-
                Machine-readable code. Optional: many 401 and 404 responses send only a message.
            details:
              description: >-
                For `VALIDATION_ERROR`, an array of issues. For `INTERNAL_ERROR`, an object with
                the `errorId` logged server-side. For `APP_PASSWORD_PERMISSION_MISSING`, an
                object with the missing `permission`. For `APP_PASSWORD_LIMIT`, an object
                with the `limit` the write broke (`category` or `own_transactions`).
              oneOf:
                - type: array
                  items:
                    $ref: './ErrorResponse.yml#/ValidationIssue'
                - type: object
                  additionalProperties: true

ValidationIssue:
  type: object
  required: [path, message, code]
  properties:
    path:
      type: array
      items:
        type: string
      description: Path to the offending field, e.g. `["amount"]`. Empty for body-level problems.
    message:
      type: string
    code:
      type: string
      description: Valibot issue type, e.g. `regex`, `picklist`, `strict_object`, `check`, `custom`
