# Expense report data (used by /api/reports/expenses)
ReportData:
  type: object
  properties:
    totalIncome:
      type: string
      description: Total income for the period (decimal string for precision)
      example: "9750000"
    totalExpenses:
      type: string
      description: Total expenses for the period (decimal string for precision)
      example: "4735000"
    netSavings:
      type: string
      description: Net savings (income - expenses) (decimal string for precision)
      example: "5015000"
    budgetHealth:
      type: number
      description: >-
        Expenses as a percentage of the total expense budget, rounded to 1 decimal place. Above 100
        means over budget; 0 when no budget is set. Monthly: that month's budgets. Yearly: the sum
        of all monthly budgets in the year.
      example: 85.5
    expenseCategories:
      type: integer
      description: Number of entries in `expenseByCategory`
      example: 6
    expenseByCategory:
      type: array
      description: >-
        Every expense category with spending in the period, sorted by value descending (not
        truncated). Categories are grouped by name; `sourceType` is absent.
      items:
        $ref: "./CategoryExpense.yml#/CategoryExpense"
    trendData:
      type: array
      description: >-
        Income versus expenses per month. Monthly range: the 3 months ending with the selected month.
        Yearly range: the 12 months of the selected year.
      items:
        $ref: "./TrendDataPoint.yml#/TrendDataPoint"
    categoryIntelligence:
      type: array
      description: >-
        One row per expense category that has a budget in the selected period and currency (the
        monthly range also requires the category to be active). Categories with spending but no
        budget are not listed here.
      items:
        $ref: "./CategoryIntelligence.yml#/CategoryIntelligence"
    recurringBreakdown:
      type: object
      nullable: true
      description: >-
        Recurring versus one-time spending for the month, across the whole workspace even when
        `user_id` is set. Always null for the yearly range, and null for a monthly range when the
        breakdown fails to compute.
      properties:
        recurringTotal:
          type: string
          description: Spending from recurring templates (decimal string)
        oneTimeTotal:
          type: string
          description: All other spending (decimal string)
        recurringByCategory:
          type: array
          items:
            type: object
            properties:
              category_id:
                type: string
              category_name:
                type: string
              amount:
                type: string
            required:
              - category_id
              - category_name
              - amount
      required:
        - recurringTotal
        - oneTimeTotal
        - recurringByCategory
    memberSummary:
      type: array
      description: >-
        Per-member totals for the selected period, sorted by total expenses descending. Covers the
        whole workspace even when `user_id` is set.
      items:
        $ref: "./MemberSummaryRow.yml#/MemberSummaryRow"
  required:
    - totalIncome
    - totalExpenses
    - netSavings
    - budgetHealth
    - expenseCategories
    - expenseByCategory
    - trendData
    - categoryIntelligence
    - recurringBreakdown
    - memberSummary
