# Transaction History Entry Schema
TransactionHistoryEntry:
  type: object
  required: [id, action, userName, userId, createdAt, oldValue, newValue]
  properties:
    id:
      type: string
    action:
      type: string
      enum: [create, update, delete]
    userName:
      type: string
      description: Member name, or `Unknown` when the user no longer exists
    userId:
      type: string
      nullable: true
      description: '`null` when the user was deleted'
    createdAt:
      type: string
      format: date-time
    oldValue:
      oneOf:
        - type: object
          additionalProperties: true
        - type: 'null'
    newValue:
      oneOf:
        - type: object
          additionalProperties: true
        - type: 'null'
