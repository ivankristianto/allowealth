# Member summary API success response
MemberSummaryResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    data:
      type: array
      description: >-
        One row per member who created at least one income or expense transaction in the period and
        currency, sorted by total expenses descending. Empty array when there are none.
      items:
        $ref: './MemberSummaryRow.yml#/MemberSummaryRow'
  required:
    - success
    - data
