# App password (MCP personal access token) schemas
AppPassword:
  type: object
  required:
    [id, name, tokenHint, permissions, preset, limits, createdAt, lastUsedAt, expiresAt, isExpired]
  properties:
    id:
      type: string
      example: 'pat_V1StGXR8Z5jdHi6B'
    name:
      type: string
      maxLength: 64
      example: 'Nightly import script'
    tokenHint:
      type: string
      description: First characters of the token. Not secret; shown so users can tell tokens apart.
      example: 'aw_pat_x7Kq'
    permissions:
      type: array
      description: |
        Grants as stored. `["*:read"]` is the read preset and `["*"]` the read-write
        preset; both also cover permissions added later. A custom token lists
        registry permissions.
      items:
        type: string
      example: ['transactions:create', 'accounts:read']
    preset:
      type: string
      enum: [read, read-write, custom]
      description: |
        `read` or `read-write` only when `permissions` is exactly that preset's
        wildcard. Any explicit list is `custom`, even one naming every permission.
    limits:
      $ref: '#/AppPasswordLimits'
    createdAt:
      type: string
      format: date-time
    lastUsedAt:
      type: [string, 'null']
      format: date-time
      description: Updated at most once a minute.
    expiresAt:
      type: [string, 'null']
      format: date-time
      description: '`null` means the token never expires.'
    isExpired:
      type: boolean

AppPasswordListResponse:
  type: object
  required: [success, data]
  properties:
    success:
      type: boolean
      example: true
    data:
      type: object
      required: [appPasswords]
      properties:
        appPasswords:
          type: array
          items:
            $ref: '#/AppPassword'

AppPasswordPermission:
  type: string
  description: A registry permission, `resource:action`. Wildcards are not accepted.
  enum:
    [
      transactions:read,
      transactions:create,
      transactions:update,
      transactions:delete,
      budgets:read,
      recurring:read,
      recurring:write,
      recurring:confirm,
      accounts:read,
      categories:read,
      settings:read,
      forecast:read,
      reports:read,
    ]

AppPasswordLimits:
  type: object
  additionalProperties: false
  description: |
    Optional write limits. `{}` means none. Limits never narrow reads. They apply to
    transaction create, update and delete, recurring template create and update, and
    occurrence confirm, over REST and MCP. A refused write returns 403
    `APP_PASSWORD_LIMIT` with `error.details.limit`.
  properties:
    category_ids:
      type: array
      minItems: 1
      maxItems: 200
      uniqueItems: true
      description: |
        Creating, editing and deleting a transaction, and creating and editing a recurring
        template, must use one of these categories; an edit must also start from one.
        Confirming an occurrence needs both its bill's category and the confirmed
        category listed. A transfer has no category, so creating, editing or deleting
        one, or changing a transaction to or from a transfer, is refused. Every id must be a category in
        the token's workspace when it is set; ids deleted later match nothing.
      items:
        type: string
      example: ['cat_V1StGXR8Z5jdHi6B']
    own_transactions_only:
      type: boolean
      description: |
        Updates and deletes reach only transactions this token created, the ones whose
        `created_by_token_id` is its id; transactions entered in the app, by another
        token or before this release are refused.
        `false` stores nothing, so responses carry the key only as `true`.

AppPasswordScope:
  type: string
  enum: [read, read-write]
  description: A preset. `read` stores `["*:read"]`, `read-write` stores `["*"]`.

AppPasswordCustomPermissions:
  type: array
  minItems: 1
  description: Stored without duplicates, in registry order.
  items:
    $ref: '#/AppPasswordPermission'

CreateAppPasswordRequest:
  type: object
  description: Send exactly one of `scope` or `permissions`.
  required: [name, expiry]
  oneOf:
    - required: [scope]
    - required: [permissions]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 64
      example: 'Nightly import script'
    scope:
      $ref: '#/AppPasswordScope'
    permissions:
      $ref: '#/AppPasswordCustomPermissions'
    limits:
      $ref: '#/AppPasswordLimits'
    expiry:
      type: string
      enum: ['30', '90', '365', never]
      description: Days until the token expires, or `never` for a token that does not expire.

CreateAppPasswordResponse:
  type: object
  required: [success, data]
  properties:
    success:
      type: boolean
      example: true
    data:
      type: object
      required: [token, appPassword]
      properties:
        token:
          type: string
          description: The raw token. Returned only in this response; only its hash is stored.
          example: 'aw_pat_6v3Yc1oQe8h0mN4bJp2rT9wLxZs5uKdAiGfE7yHqC0M'
        appPassword:
          $ref: '#/AppPassword'

UpdateAppPasswordRequest:
  type: object
  description: |
    Send any of a name, an access change and limits. `scope` and `permissions` exclude
    each other. `limits` replaces the stored limits; `{}` clears them.
  minProperties: 1
  not:
    required: [scope, permissions]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 64
    scope:
      $ref: '#/AppPasswordScope'
    permissions:
      $ref: '#/AppPasswordCustomPermissions'
    limits:
      $ref: '#/AppPasswordLimits'

AppPasswordResponse:
  type: object
  required: [success, data]
  properties:
    success:
      type: boolean
      example: true
    data:
      type: object
      required: [appPassword]
      properties:
        appPassword:
          $ref: '#/AppPassword'

RevokeAppPasswordResponse:
  type: object
  required: [success, data]
  properties:
    success:
      type: boolean
      example: true
    data:
      type: object
      required: [id]
      properties:
        id:
          type: string
          example: 'pat_V1StGXR8Z5jdHi6B'

AppPasswordSelf:
  type: object
  description: The calling app password, as `GET /api/app-password/self` describes it.
  required: [kind, id, name, preset, permissions, limits, expires_at, created_at, rate_limit]
  properties:
    kind:
      type: string
      enum: [app_password]
    id:
      type: string
      example: 'pat_V1StGXR8Z5jdHi6B'
    name:
      type: string
      example: 'Nightly import script'
    preset:
      type: string
      enum: [read, read-write, custom]
    permissions:
      type: array
      description: |
        What the token may do right now. Preset wildcards are expanded, so this
        lists registry permissions only.
      items:
        $ref: '#/AppPasswordPermission'
      example: ['transactions:create', 'budgets:read']
    limits:
      $ref: '#/AppPasswordLimits'
    expires_at:
      type: [string, 'null']
      format: date-time
      description: '`null` means the token never expires.'
    created_at:
      type: string
      format: date-time
    rate_limit:
      type: object
      description: |
        The per-token REST limit. Live counts stay in the `X-RateLimit-Limit`,
        `X-RateLimit-Remaining` and `X-RateLimit-Reset` headers.
      required: [limit, window_seconds]
      properties:
        limit:
          type: integer
          example: 60
        window_seconds:
          type: integer
          example: 60

AppPasswordSelfResponse:
  type: object
  required: [success, data]
  properties:
    success:
      type: boolean
      example: true
    data:
      $ref: '#/AppPasswordSelf'
