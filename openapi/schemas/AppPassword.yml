# App password (MCP personal access token) schemas
AppPassword:
  type: object
  required: [id, name, tokenHint, scope, createdAt, lastUsedAt, expiresAt, isExpired]
  properties:
    id:
      type: string
      example: 'pat_V1StGXR8Z5jdHi6B'
    name:
      type: string
      maxLength: 64
      example: 'Nightly import script'
    tokenHint:
      type: string
      description: First characters of the token. Not secret; shown so users can tell tokens apart.
      example: 'aw_pat_x7Kq'
    scope:
      type: string
      enum: [read, read-write]
      description: '`read` tokens can call only the read MCP tools.'
    createdAt:
      type: string
      format: date-time
    lastUsedAt:
      type: [string, 'null']
      format: date-time
      description: Updated at most once a minute.
    expiresAt:
      type: [string, 'null']
      format: date-time
      description: '`null` means the token never expires.'
    isExpired:
      type: boolean

AppPasswordListResponse:
  type: object
  required: [success, data]
  properties:
    success:
      type: boolean
      example: true
    data:
      type: object
      required: [appPasswords]
      properties:
        appPasswords:
          type: array
          items:
            $ref: '#/AppPassword'

CreateAppPasswordRequest:
  type: object
  required: [name, scope, expiry]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 64
      example: 'Nightly import script'
    scope:
      type: string
      enum: [read, read-write]
    expiry:
      type: string
      enum: ['30', '90', '365', never]
      description: Days until the token expires, or `never` for a token that does not expire.

CreateAppPasswordResponse:
  type: object
  required: [success, data]
  properties:
    success:
      type: boolean
      example: true
    data:
      type: object
      required: [token, appPassword]
      properties:
        token:
          type: string
          description: The raw token. Returned only in this response; only its hash is stored.
          example: 'aw_pat_6v3Yc1oQe8h0mN4bJp2rT9wLxZs5uKdAiGfE7yHqC0M'
        appPassword:
          $ref: '#/AppPassword'

RevokeAppPasswordResponse:
  type: object
  required: [success, data]
  properties:
    success:
      type: boolean
      example: true
    data:
      type: object
      required: [id]
      properties:
        id:
          type: string
          example: 'pat_V1StGXR8Z5jdHi6B'
