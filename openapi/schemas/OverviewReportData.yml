# Overview report data - lightweight summary across expense and income
OverviewReportData:
  type: object
  properties:
    totalIncome:
      type: string
      description: Total income for the selected period (decimal string)
      example: "9750000"
    totalExpenses:
      type: string
      description: Total expenses for the selected period (decimal string)
      example: "4735000"
    netSavings:
      type: string
      description: Net savings for the selected period (income - expenses, decimal string)
      example: "5015000"
    savingsRate:
      type: string
      description: >-
        Net savings as a percentage of income, rounded to 2 decimal places (decimal string). Negative
        when expenses exceed income, "0" when income is zero.
      example: "51.44"
    trendData:
      type: array
      description: >-
        Income versus expenses per month. Monthly range: the 3 months ending with the selected month.
        Yearly range: the 12 months of the selected year.
      items:
        $ref: "./TrendDataPoint.yml#/TrendDataPoint"
    incomePreview:
      type: object
      description: Income by category for the overview page
      properties:
        topCategories:
          type: array
          description: >-
            Every income category with income in the period, sorted by value descending (not
            truncated). Each item carries `sourceType`.
          items:
            $ref: "./CategoryExpense.yml#/CategoryExpense"
        total:
          type: string
          description: Total income for the selected period
          example: "9750000"
      required:
        - topCategories
        - total
    expensePreview:
      type: object
      description: Expenses by category for the overview page
      properties:
        topCategories:
          type: array
          description: >-
            Every expense category with spending in the period, sorted by value descending (not
            truncated). Categories are grouped by name.
          items:
            $ref: "./CategoryExpense.yml#/CategoryExpense"
        total:
          type: string
          description: Total expenses for the selected period
          example: "4735000"
      required:
        - topCategories
        - total
  required:
    - totalIncome
    - totalExpenses
    - netSavings
    - savingsRate
    - trendData
    - incomePreview
    - expensePreview
