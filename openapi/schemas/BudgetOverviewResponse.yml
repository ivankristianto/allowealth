# Budget Overview Response Schema
BudgetOverviewResponse:
  allOf:
    - $ref: './ApiErrorResponse.yml#/ApiResponse'
    - type: object
      required: [success, data]
      properties:
        data:
          type: object
          description: >-
            One month's budgets in one currency. Only budgets whose category is an active expense
            category are included. Totals are sums over `categories`.
          required:
            - total_budget
            - total_spent
            - total_balance
            - categories_warning
            - categories_exceeded
            - categories
          properties:
            total_budget:
              type: string
              pattern: '^\d+(\.\d{1,2})?$'
              description: Sum of `budget_amount` over all categories
            total_spent:
              type: string
              pattern: '^\d+(\.\d{1,2})?$'
              description: Sum of expense transactions in the month for the budgeted categories
            total_balance:
              type: string
              pattern: '^-?\d+(\.\d{1,2})?$'
              description: total_budget minus total_spent. Negative when overspent.
            categories_warning:
              type: integer
              description: Number of categories with status `warning`
            categories_exceeded:
              type: integer
              description: Number of categories with status `exceeded`
            categories:
              type: array
              description: One row per budget. Order follows the database and is not guaranteed.
              items:
                $ref: './BudgetOverviewCategory.yml#/BudgetOverviewCategory'
