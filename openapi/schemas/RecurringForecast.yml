# Recurring cash-flow forecast (RecurringForecastService.getForecast)
RecurringForecast:
  type: object
  required: [rows, totals, monthKeys]
  properties:
    monthKeys:
      type: array
      description: Forecast months in order, starting with the current month in the workspace timezone
      items:
        type: string
        pattern: '^\d{4}-\d{2}$'
        example: '2026-03'
    rows:
      type: array
      description: One row per matching template
      items:
        type: object
        required:
          - templateId
          - templateName
          - templateType
          - frequencyLabel
          - currency
          - status
          - category
          - account
          - months
        properties:
          templateId:
            type: string
          templateName:
            type: string
          templateType:
            type: string
            enum: [expense, income]
          frequencyLabel:
            type: string
            description: Human-readable frequency, e.g. `Monthly` or `Every 2 weeks`
          currency:
            type: string
            enum: [IDR, USD, SGD, PHP, EUR, GBP, MYR, THB, JPY, AUD, KRW, INR]
          status:
            type: string
            enum: [active, paused]
            description: Completed and cancelled templates are never included
          category:
            type: object
            required: [id, name, icon, color]
            properties:
              id:
                type: string
              name:
                type: string
              icon:
                type: string
              color:
                type: string
          account:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
          months:
            type: object
            description: >-
              Keyed by month (`YYYY-MM`, same keys as `monthKeys`). Value is the projected amount
              for that month as a decimal string, or `null` when nothing is due.
            additionalProperties:
              type: string
              nullable: true
    totals:
      type: array
      description: Per-currency monthly totals. Amounts are never summed across currencies.
      items:
        type: object
        required: [currency, months]
        properties:
          currency:
            type: string
            enum: [IDR, USD, SGD, PHP, EUR, GBP, MYR, THB, JPY, AUD, KRW, INR]
          months:
            type: object
            description: Keyed by month (`YYYY-MM`)
            additionalProperties:
              type: object
              required: [income, expense, net]
              properties:
                income:
                  type: string
                expense:
                  type: string
                net:
                  type: string
                  description: income minus expense, may be negative
