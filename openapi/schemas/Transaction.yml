# Transaction Schema (API output of transformTransaction)
Transaction:
  type: object
  required:
    - id
    - type
    - amount
    - currency
    - description
    - transaction_date
    - updated_by_user_id
    - created_by_token_id
    - deleted_by_user_id
    - deleted_at
    - created_at
    - updated_at
    - category
    - account
    - toAccount
    - has_history
    - is_recurring
  properties:
    id:
      type: string
      description: Transaction ID (nanoid)
    type:
      type: string
      enum: [expense, income, transfer]
    amount:
      type: string
      pattern: '^\d{1,15}(\.\d{1,2})?$'
      description: Positive decimal amount as a string. The sign comes from `type`.
      example: '150000'
    currency:
      type: string
      enum: [IDR, USD, SGD, PHP, EUR, GBP, MYR, THB, JPY, AUD, KRW, INR]
    description:
      type: string
      nullable: true
    transaction_date:
      type: string
      format: date-time
      description: >-
        Transaction date as an ISO timestamp. Transactions created through the API are stored at
        midnight UTC, e.g. `2026-03-10T00:00:00.000Z`.
    updated_by_user_id:
      type: string
      nullable: true
    created_by_token_id:
      type: string
      nullable: true
      description: >-
        The app password that created the transaction, or null when it was entered in the app,
        imported, or created by an OAuth token. A token limited to its own transactions can edit
        and delete only rows where this equals its id (`GET /api/app-password/self` returns it).
    deleted_by_user_id:
      type: string
      nullable: true
    deleted_at:
      type: string
      format: date-time
      nullable: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    category:
      type: object
      nullable: true
      description: Budget category. `null` for transfers.
      required: [id, name, type, icon, color]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [expense, income]
        icon:
          type: string
        color:
          type: string
    account:
      type: object
      description: Source account (where the money comes from or goes into)
      required: [id, name, type]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
    toAccount:
      type: object
      nullable: true
      description: Destination account for transfers, otherwise `null`
      required: [id, name, type]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
    has_history:
      type: boolean
      description: >-
        Whether the transaction has been edited or deleted. Computed only by the list endpoint;
        single-transaction responses always return `false`.
    is_recurring:
      type: boolean
      description: >-
        Whether a recurring occurrence produced this transaction. Computed only by the list
        endpoint; single-transaction responses always return `false`.
    created_by_user_name:
      type: string
      description: Name of the member who created it. Present only in list responses.
