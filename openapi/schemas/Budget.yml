# Budget Schema (the stored budget row, as returned by the API)
Budget:
  type: object
  required:
    - id
    - workspace_id
    - created_by_user_id
    - category_id
    - month
    - year
    - budget_amount
    - currency
    - is_closed
    - notes
    - created_at
    - updated_at
  properties:
    id:
      type: string
      description: Budget ID (nanoid)
    workspace_id:
      type: string
      description: Owning workspace ID
    created_by_user_id:
      type: string
      description: ID of the user who created the budget
    category_id:
      type: string
      description: Category ID (nanoid)
    month:
      type: integer
      minimum: 1
      maximum: 12
      description: Month (1-12)
    year:
      type: integer
      minimum: 2000
      maximum: 2100
      description: Year (e.g., 2025, 2026)
    budget_amount:
      type: string
      pattern: '^\d+(\.\d{1,2})?$'
      description: Budget amount as a decimal string with up to 2 decimals (e.g. "500.50")
    currency:
      type: string
      enum: [IDR, USD, SGD, PHP, EUR, GBP, MYR, THB, JPY, AUD, KRW, INR]
    is_closed:
      type: boolean
      description: Whether the budget period is closed (locked from edits)
    notes:
      type: string
      nullable: true
      maxLength: 500
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
