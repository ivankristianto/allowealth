RecurringOccurrence:
  type: object
  description: One expected payment or receipt generated from a recurring template
  required:
    - id
    - template_id
    - workspace_id
    - due_date
    - occurrence_number
    - status
    - transaction_id
    - confirmed_amount
    - skip_reason
    - confirmed_at
    - created_at
    - updated_at
    - templateName
    - templateType
    - templateAmount
    - templateFrequency
    - templateIntervalCount
    - currency
    - category
    - account
    - isInstallment
    - installmentLabel
    - totalOccurrences
  properties:
    id:
      type: string
      description: Occurrence ID, used by the confirm endpoint (and the session-only skip endpoint)
    template_id:
      type: string
    workspace_id:
      type: string
    due_date:
      type: string
      format: date
    occurrence_number:
      type: integer
      minimum: 1
    status:
      type: string
      enum: [pending, confirmed, skipped]
    transaction_id:
      type: string
      nullable: true
      description: Transaction created on confirm
    confirmed_amount:
      type: string
      nullable: true
      description: Amount used on confirm, decimal as a string
    skip_reason:
      type: string
      nullable: true
    confirmed_at:
      type: string
      format: date-time
      nullable: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    templateName:
      type: string
    templateType:
      type: string
      enum: [expense, income]
    templateAmount:
      type: string
      description: Expected amount from the template, decimal as a string
    templateFrequency:
      type: string
      enum: [weekly, monthly]
    templateIntervalCount:
      type: integer
      minimum: 1
    currency:
      type: string
      enum: [IDR, USD, SGD, PHP, EUR, GBP, MYR, THB, JPY, AUD, KRW, INR]
    category:
      type: object
      description: The template's category (the default `category_id` for confirm)
      required: [id, name, icon, color, type]
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: string
        color:
          type: string
        type:
          type: string
          enum: [expense, income]
    account:
      type: object
      description: The template's account (the default `account_id` for confirm)
      required: [id, name, type]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
    isInstallment:
      type: boolean
    installmentLabel:
      type: string
      nullable: true
    totalOccurrences:
      type: integer
      nullable: true
