# Update User Profile Request Schema
UpdateUserProfileRequest:
  type: object
  required:
    - name
    - email
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 255
      description: User display name
      example: John Doe
    email:
      type: string
      format: email
      description: User email address. A new value starts the verify-first email change flow.
      example: john.doe@example.com
    phone:
      type: string
      maxLength: 50
      description: Phone number, including country code
      example: '+62 812 3456 7890'
    currentPassword:
      type: string
      format: password
      description: Current password. Required when `email` differs from the current address.
