# Budgets List Response Schema
BudgetsListResponse:
  type: object
  required:
    - success
    - data
  properties:
    success:
      type: boolean
    data:
      type: array
      description: Budget rows for the month, unordered. No spending figures; see GET /api/budget/overview.
      items:
        $ref: './BudgetWithCategory.yml#/BudgetWithCategory'
