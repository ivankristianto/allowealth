# Category total, used for both expense and income category breakdowns
CategoryExpense:
  type: object
  properties:
    name:
      type: string
      description: Category name
      example: "Utilities"
    value:
      type: string
      description: Total for this category in the selected period and currency (decimal string)
      example: "1850000"
    sourceType:
      type: string
      enum: [active, passive, other]
      description: Income source classification. Present on income categories only, absent on expense categories.
  required:
    - name
    - value
