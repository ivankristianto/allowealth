# User endpoint paths
paths:
  /api/user/profile:
    get:
      tags: [User]
      summary: Get user profile
      description: |
        Retrieve the current authenticated user's profile.
        If an email change is in progress, `data.pendingEmail` contains the
        email address awaiting verification.
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '../schemas/UserProfileResponse.yml#/UserProfileResponse'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '404':
          $ref: '../responses/common.yml#/NotFound'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

    put:
      tags: [User]
      summary: Update user profile
      description: |
        Update user profile fields.
        When the email is changed, the endpoint starts a verify-first flow:
        it stores `data.pendingEmail`, mails a confirmation link to the new
        address and a notice to the current one, and leaves the email unchanged
        until the link is confirmed.

        An email change requires `currentPassword`, checked against the Better
        Auth credential account, and is limited to 5 requests per hour per user.
        The response is the same whether or not another account already uses
        the new address; in that case no link is sent. The password check runs
        before any write, so a rejected request persists nothing.
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/UpdateUserProfileRequest.yml#/UpdateUserProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '../schemas/UserProfileUpdateResponse.yml#/UserProfileUpdateResponse'
        '400':
          description: |
            Validation error, missing current password (`CURRENT_PASSWORD_REQUIRED`)
            or wrong current password (`INVALID_PASSWORD`)
          content:
            application/json:
              schema:
                $ref: '../schemas/ErrorResponse.yml#/ErrorResponse'
              examples:
                currentPasswordRequired:
                  value:
                    success: false
                    error:
                      message: Enter your current password to change your email
                      code: CURRENT_PASSWORD_REQUIRED
                invalidPassword:
                  value:
                    success: false
                    error:
                      message: Incorrect password
                      code: INVALID_PASSWORD
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          description: Email changes are disabled in demo mode (`DEMO_MODE`)
          content:
            application/json:
              schema:
                $ref: '../schemas/ErrorResponse.yml#/ErrorResponse'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/user/sessions:
    get:
      tags: [User]
      summary: List active sessions
      description: |
        List all active sessions for the authenticated user.
        Current session is returned first. Supports `?_render=html` for
        server-rendered HTML partial.
      security:
        - sessionAuth: []
      parameters:
        - name: _render
          in: query
          required: false
          schema:
            type: string
            enum: [html]
          description: Return server-rendered HTML fragment instead of JSON
      responses:
        '200':
          description: Sessions listed successfully
          content:
            application/json:
              schema:
                $ref: '../schemas/SessionListResponse.yml#/SessionListResponse'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

    delete:
      tags: [User]
      summary: Revoke a single session
      description: |
        Revoke a single non-current session by ID. The session token is
        resolved server-side to avoid exposing tokens in the client.
        Attempting to revoke the current session returns 400.
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/SessionListResponse.yml#/RevokeSessionRequest'
      responses:
        '200':
          description: Session revoked successfully
          content:
            application/json:
              schema:
                $ref: '../schemas/SessionListResponse.yml#/SessionActionResponse'
        '400':
          description: Cannot revoke the current session or validation error
          content:
            application/json:
              schema:
                $ref: '../schemas/ErrorResponse.yml#/ErrorResponse'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '404':
          $ref: '../responses/common.yml#/NotFound'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

    post:
      tags: [User]
      summary: Revoke all other sessions
      description: |
        Revoke all sessions except the current one. Uses POST because the
        action is a bulk destructive operation, not a resource creation.
      security:
        - sessionAuth: []
      responses:
        '200':
          description: All other sessions revoked
          content:
            application/json:
              schema:
                $ref: '../schemas/SessionListResponse.yml#/SessionActionResponse'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/user/app-passwords:
    get:
      tags: [User]
      summary: List app passwords
      description: |
        List the authenticated user's app passwords (MCP personal access tokens),
        newest first. Raw tokens are never returned here. Supports `?_render=html`
        for the server-rendered list partial.
      security:
        - sessionAuth: []
      parameters:
        - name: _render
          in: query
          required: false
          schema:
            type: string
            enum: [html]
          description: Return server-rendered HTML fragment instead of JSON
      responses:
        '200':
          description: App passwords listed
          content:
            application/json:
              schema:
                $ref: '../schemas/AppPassword.yml#/AppPasswordListResponse'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

    post:
      tags: [User]
      summary: Create an app password
      description: |
        Create a long-lived `aw_pat_` token for `/api/mcp` and the stdio MCP server.
        The raw token is in this response only (sent with `Cache-Control: no-store`).
        Requires a session signed in within the last 15 minutes, otherwise 403
        `REAUTH_REQUIRED`. At most 20 app passwords per user. Limited to 10
        creations per user per 15 minutes. Disabled in demo mode.
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/AppPassword.yml#/CreateAppPasswordRequest'
      responses:
        '201':
          description: App password created
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '../schemas/AppPassword.yml#/CreateAppPasswordResponse'
        '400':
          description: Validation error, or the user has no workspace (`NO_WORKSPACE`)
          content:
            application/json:
              schema:
                $ref: '../schemas/ErrorResponse.yml#/ErrorResponse'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          description: Sign-in older than 15 minutes (`REAUTH_REQUIRED`), demo mode, or CSRF failure
          content:
            application/json:
              schema:
                $ref: '../schemas/ErrorResponse.yml#/ErrorResponse'
        '409':
          description: The user already has 20 app passwords (`LIMIT_REACHED`)
          content:
            application/json:
              schema:
                $ref: '../schemas/ErrorResponse.yml#/ErrorResponse'
        '429':
          description: Too many app passwords created recently
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/user/app-passwords/{id}:
    delete:
      tags: [User]
      summary: Revoke an app password
      description: Delete one of the authenticated user's app passwords. It stops working immediately.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: 'pat_V1StGXR8Z5jdHi6B'
      responses:
        '200':
          description: App password revoked
          content:
            application/json:
              schema:
                $ref: '../schemas/AppPassword.yml#/RevokeAppPasswordResponse'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '404':
          description: No app password with this id belongs to the user (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '../schemas/ErrorResponse.yml#/ErrorResponse'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/user/password:
    put:
      tags: [User]
      summary: Change user password
      description: |
        Change the password on the Better Auth credential account. Requires the
        current password. Every other session is signed out, and the response
        sets a fresh session cookie for the current device, so `reauthRequired`
        is `false`. Limited to 5 requests per 15 minutes per user.
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/UpdatePasswordRequest.yml#/UpdatePasswordRequest'
      responses:
        '200':
          description: Password updated; other sessions revoked
          headers:
            Set-Cookie:
              description: New session cookie for the current device
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/PasswordUpdateResponse.yml#/PasswordUpdateResponse'
        '400':
          description: |
            Validation error (`VALIDATION_ERROR`, `WEAK_PASSWORD`), wrong current
            password (`INVALID_PASSWORD`) or an account without a password,
            such as a Google-only account (`PASSWORD_NOT_SET`)
          content:
            application/json:
              schema:
                $ref: '../schemas/ErrorResponse.yml#/ErrorResponse'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          description: Password changes are disabled in demo mode (`DEMO_MODE`)
          content:
            application/json:
              schema:
                $ref: '../schemas/ErrorResponse.yml#/ErrorResponse'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'
