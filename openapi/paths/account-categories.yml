# Account Categories endpoint paths
paths:
  /api/account-categories:
    get:
      tags: [Accounts]
      summary: List all account categories
      description: >-
        Account categories in the caller's workspace as a bare array in `data`, with no
        pagination. System categories come first, then by `sortOrder`, then by name. Bad filter
        values are not rejected.
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: isLiability
          in: query
          description: >-
            Filter by liability status. Exactly `true` keeps liability categories; any other
            value keeps only non-liability ones. Omit it to get both.
          schema:
            type: boolean
        - name: isSystem
          in: query
          description: >-
            Filter by system categories. Exactly `true` keeps system categories; any other value
            keeps only custom ones. Omit it to get both.
          schema:
            type: boolean
        - name: _render
          in: query
          description: >-
            Set to `html` to get a server-rendered table fragment (`text/html`) instead of JSON.
            Used by the web UI. Only honored with the header `X-Requested-With: XMLHttpRequest`;
            without it the request fails with 403. API clients should omit it.
          schema:
            type: string
            enum: [html]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '../schemas/AccountCategoriesListResponse.yml#/AccountCategoriesListResponse'
            text/html:
              schema:
                type: string
                description: Table fragment, returned only for `_render=html`
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'
    post:
      tags: [Accounts]
      summary: Create a new account category
      description: Create a new custom account or liability category
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/CreateAccountCategoryRequest.yml#/CreateAccountCategoryRequest'
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: '../schemas/AccountCategoryResponse.yml#/AccountCategoryResponse'
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '409':
          description: Category with this name already exists
          content:
            application/json:
              schema:
                $ref: '../schemas/ErrorResponse.yml#/ErrorResponse'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/account-categories/{id}:
    get:
      tags: [Accounts]
      summary: Get an account category by ID
      description: >-
        Retrieve a single account category in the caller's workspace, with its active account
        count. An ID from another workspace returns 404 with message `Category not found`.
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '../parameters/common.yml#/IdParameter'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '../schemas/AccountCategoryResponse.yml#/AccountCategoryResponse'
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '404':
          $ref: '../responses/common.yml#/NotFound'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'
    put:
      tags: [Accounts]
      summary: Update an account category
      description: Update an existing account category
      security:
        - sessionAuth: []
      parameters:
        - $ref: '../parameters/common.yml#/IdParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/UpdateAccountCategoryRequest.yml#/UpdateAccountCategoryRequest'
      responses:
        '200':
          description: Category updated successfully
          content:
            application/json:
              schema:
                $ref: '../schemas/AccountCategoryResponse.yml#/AccountCategoryResponse'
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          description: System categories cannot be modified
          content:
            application/json:
              schema:
                $ref: '../schemas/ErrorResponse.yml#/ErrorResponse'
        '404':
          $ref: '../responses/common.yml#/NotFound'
        '409':
          description: Category with this name already exists
          content:
            application/json:
              schema:
                $ref: '../schemas/ErrorResponse.yml#/ErrorResponse'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'
    delete:
      tags: [Accounts]
      summary: Delete an account category
      description: Delete a custom account category
      security:
        - sessionAuth: []
      parameters:
        - $ref: '../parameters/common.yml#/IdParameter'
      responses:
        '200':
          description: Category deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Category deleted successfully
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          description: System categories cannot be deleted
          content:
            application/json:
              schema:
                $ref: '../schemas/ErrorResponse.yml#/ErrorResponse'
        '409':
          description: Category has accounts assigned
          content:
            application/json:
              schema:
                $ref: '../schemas/ErrorResponse.yml#/ErrorResponse'
        '404':
          $ref: '../responses/common.yml#/NotFound'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'
