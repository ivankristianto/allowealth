# Report endpoint paths
# P2: TODO - Add description notes about dynamic error message values (e.g., "Invalid month: {value}")
# P2: TODO - Add separate example for yearly period format validation error
# P3: TODO - Consider adding rate limiting documentation to security section
paths:
  /api/reports:
    get:
      tags: [Reports]
      summary: Overview report
      description: |
        Retrieve a lightweight financial overview for the given period: income,
        expense and savings totals, savings rate, a monthly trend, and income and
        expense totals by category. Use `/api/reports/expenses` or
        `/api/reports/income` for the detailed reports.

        All amounts are decimal strings in the selected currency. Only
        transactions recorded in that currency are counted; nothing is converted.

        Supports JSON (default) and server-rendered HTML partials
        (`_render=html`, browser use only).

        **Validation order:** `_partial`, `range`, `period`, `currency`,
        `user_id`. The first failure returns 400 with one of these codes:
        `INVALID_PARTIAL`, `INVALID_RANGE`, `MISSING_PERIOD`,
        `INVALID_PERIOD_FORMAT`, `INVALID_MONTH`, `INVALID_YEAR`,
        `INVALID_CURRENCY`, `INVALID_USER_ID`.

        **Report Types:**
        - Monthly: one month (`period=YYYY-MM`)
        - Yearly: one calendar year (`period=YYYY`)
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: range
          in: query
          required: true
          description: Report range type
          schema:
            type: string
            enum: [monthly, yearly]
          example: monthly
        - name: period
          in: query
          required: true
          description: |
            Period to report on. Year must be 2000 to 2100.
            - For monthly: YYYY-MM with a two-digit month (e.g., "2026-03")
            - For yearly: YYYY (e.g., "2026")
          schema:
            type: string
            pattern: '^\d{4}(-\d{2})?$'
          example: "2026-03"
        - name: currency
          in: query
          description: |
            Currency to aggregate. Defaults to the workspace primary currency when
            omitted. Must be the workspace primary or secondary currency, otherwise
            400 `INVALID_CURRENCY`.
          schema:
            type: string
            enum: [IDR, USD, SGD, PHP, EUR, GBP, MYR, THB, JPY, AUD, KRW, INR]
        - name: user_id
          in: query
          description: |
            Optional workspace member ID. Narrows every total, the trend and the
            category lists to transactions that member created. 400
            `INVALID_USER_ID` when the ID is not a member of the workspace.
          schema:
            type: string
        - name: _render
          in: query
          description: |
            Response format. `html` returns server-rendered partials for the web
            app and requires the header `X-Requested-With: XMLHttpRequest`;
            without it the request gets 403 with a JSON body
            `{ success: false, error: { message } }` and no code. API clients
            should omit this parameter.
          schema:
            type: string
            enum: [json, html]
            default: json
        - name: _partial
          in: query
          description: |
            Which partial(s) to render when using HTML format. Validated on every
            request (an unknown value returns 400 `INVALID_PARTIAL` even for JSON)
            but otherwise ignored for JSON.
            - summary: Summary metrics cards
            - charts: Trend chart
            - previews: Expense and income preview cards
            - wealth: Account totals, debt totals and allocation
            - selector: Report selector controls (only when requested by name; `all` does not include it)
            - all: summary, charts, previews and wealth (default)
          schema:
            type: string
            enum: [summary, charts, previews, wealth, selector, all]
            default: all
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '../schemas/OverviewReportResponse.yml#/OverviewReportResponse'
              example:
                success: true
                data:
                  totalIncome: "9750000"
                  totalExpenses: "4735000"
                  netSavings: "5015000"
                  savingsRate: "51.44"
                  trendData:
                    - name: "Jan"
                      income: "25245000"
                      expenses: "33719000"
                    - name: "Feb"
                      income: "60525000"
                      expenses: "41816000"
                    - name: "Mar"
                      income: "9750000"
                      expenses: "4735000"
                  expensePreview:
                    topCategories:
                      - name: "Utilities"
                        value: "1850000"
                      - name: "Dining"
                        value: "905000"
                    total: "4735000"
                  incomePreview:
                    topCategories:
                      - name: "Salary"
                        value: "7500000"
                        sourceType: "active"
                      - name: "Dividends"
                        value: "2250000"
                        sourceType: "passive"
                    total: "9750000"
            text/html:
              schema:
                type: string
                description: |
                  Server-rendered HTML fragments with PARTIAL markers.
                  Each partial is prefixed with a comment marker (e.g., `<!-- PARTIAL:summary -->`).
              example: |
                <!-- PARTIAL:summary -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">...</div>

                <!-- PARTIAL:charts -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">...</div>

                <!-- PARTIAL:previews -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">...</div>
        '400':
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: '../schemas/ApiErrorResponse.yml#/ApiResponse'
              examples:
                invalidRange:
                  value:
                    success: false
                    error:
                      message: "Invalid range parameter. Must be 'monthly' or 'yearly'."
                      code: "INVALID_RANGE"
                missingPeriod:
                  value:
                    success: false
                    error:
                      message: "Period parameter is required."
                      code: "MISSING_PERIOD"
                invalidPeriod:
                  value:
                    success: false
                    error:
                      message: "Invalid monthly period format. Expected 'YYYY-MM', got '2026-3'."
                      code: "INVALID_PERIOD_FORMAT"
                invalidMonth:
                  value:
                    success: false
                    error:
                      message: "Invalid month: 13. Must be between 1 and 12."
                      code: "INVALID_MONTH"
                invalidYear:
                  value:
                    success: false
                    error:
                      message: "Invalid year: 1999. Must be between 2000 and 2100."
                      code: "INVALID_YEAR"
                invalidCurrency:
                  value:
                    success: false
                    error:
                      message: "Invalid currency parameter for this workspace."
                      code: "INVALID_CURRENCY"
                invalidUserId:
                  value:
                    success: false
                    error:
                      message: "Invalid user_id: not a member of this workspace."
                      code: "INVALID_USER_ID"
                invalidPartial:
                  value:
                    success: false
                    error:
                      message: "Invalid _partial parameter. Must be one of: summary, charts, previews, wealth, selector, all."
                      code: "INVALID_PARTIAL"
            text/html:
              schema:
                type: string
                description: Error message rendered as an HTML alert (only for accepted `_render=html` requests)
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/reports/expenses:
    get:
      tags: [Reports]
      summary: Get expense detail report
      description: |
        Retrieve the expense report for the given period: totals, budget health,
        expenses by category, a monthly trend, budgeted category rows, the
        recurring versus one-time split (monthly only) and per-member totals.

        All amounts are decimal strings in the selected currency, except
        `budgetHealth` (a number). Only transactions recorded in that currency are
        counted. `user_id` narrows everything except `memberSummary` and
        `recurringBreakdown`, which always cover the whole workspace.

        Supports JSON (default) and server-rendered HTML partials
        (`_render=html`, browser use only).

        **Validation order:** `_partial`, `range`, `period`, `currency`,
        `user_id`. The first failure returns 400 with one of these codes:
        `INVALID_PARTIAL`, `INVALID_RANGE`, `MISSING_PERIOD`,
        `INVALID_PERIOD_FORMAT`, `INVALID_MONTH`, `INVALID_YEAR`,
        `INVALID_CURRENCY`, `INVALID_USER_ID`. Messages match the overview
        report's.
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: range
          in: query
          required: true
          description: Report range type
          schema:
            type: string
            enum: [monthly, yearly]
          example: monthly
        - name: period
          in: query
          required: true
          description: |
            Period to report on. Year must be 2000 to 2100.
            - For monthly: YYYY-MM with a two-digit month (e.g., "2026-03")
            - For yearly: YYYY (e.g., "2026")
          schema:
            type: string
            pattern: '^\d{4}(-\d{2})?$'
          example: "2026-03"
        - name: currency
          in: query
          description: |
            Currency to aggregate. Defaults to the workspace primary currency when
            omitted. Must be the workspace primary or secondary currency, otherwise
            400 `INVALID_CURRENCY`.
          schema:
            type: string
            enum: [IDR, USD, SGD, PHP, EUR, GBP, MYR, THB, JPY, AUD, KRW, INR]
        - name: user_id
          in: query
          description: |
            Optional workspace member ID. Narrows totals, budget health, category
            data and the trend to transactions that member created; does not
            narrow `memberSummary` or `recurringBreakdown`. 400 `INVALID_USER_ID`
            when the ID is not a member of the workspace.
          schema:
            type: string
        - name: _render
          in: query
          description: |
            Response format. `html` returns server-rendered partials for the web
            app and requires the header `X-Requested-With: XMLHttpRequest`;
            without it the request gets 403 with a JSON body
            `{ success: false, error: { message } }` and no code. API clients
            should omit this parameter.
          schema:
            type: string
            enum: [json, html]
            default: json
        - name: _partial
          in: query
          description: |
            Which partial(s) to render when using HTML format. Validated on every
            request (an unknown value returns 400 `INVALID_PARTIAL` even for JSON)
            but otherwise ignored for JSON.
            - summary: Budget summary cards
            - charts: Expense donut chart and recurring breakdown
            - table: Category table with spending details
            - members: Per-member spending breakdown
            - selector: Report selector controls (only when requested by name; `all` does not include it)
            - all: summary, charts, table and members (default)
          schema:
            type: string
            enum: [summary, charts, table, members, selector, all]
            default: all
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '../schemas/ReportResponse.yml#/ReportResponse'
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/reports/income:
    get:
      tags: [Reports]
      summary: Get income detail report
      description: |
        Retrieve the income report for the given period: totals by source type
        with growth against the previous period, income by category, a monthly
        trend by source type, per-member totals, and a paginated transaction
        history.

        All amounts are decimal strings in the selected currency. Only
        transactions recorded in that currency are counted.

        Filters apply unevenly:
        - `user_id` narrows everything except `members`.
        - `source_type` and `category_id` narrow `history` only.

        Supports JSON (default) and server-rendered HTML partials
        (`_render=html`, browser use only).

        **Validation order:** `_partial`, `range`, `period`, `currency`,
        `user_id`. The first failure returns 400 with one of these codes:
        `INVALID_PARTIAL`, `INVALID_RANGE`, `MISSING_PERIOD`,
        `INVALID_PERIOD_FORMAT`, `INVALID_MONTH`, `INVALID_YEAR`,
        `INVALID_CURRENCY`, `INVALID_USER_ID`. `page`, `pageSize`,
        `source_type` and `category_id` never cause a 400: bad values are
        clamped or ignored.
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: range
          in: query
          required: true
          description: Report range type
          schema:
            type: string
            enum: [monthly, yearly]
          example: monthly
        - name: period
          in: query
          required: true
          description: |
            Period to report on. Year must be 2000 to 2100.
            - For monthly: YYYY-MM with a two-digit month (e.g., "2026-03")
            - For yearly: YYYY (e.g., "2026")
          schema:
            type: string
            pattern: '^\d{4}(-\d{2})?$'
          example: "2026-03"
        - name: currency
          in: query
          description: |
            Currency to aggregate. Defaults to the workspace primary currency when
            omitted. Must be the workspace primary or secondary currency, otherwise
            400 `INVALID_CURRENCY`.
          schema:
            type: string
            enum: [IDR, USD, SGD, PHP, EUR, GBP, MYR, THB, JPY, AUD, KRW, INR]
        - name: user_id
          in: query
          description: |
            Optional workspace member ID. Narrows everything except `members` to
            transactions that member created. 400 `INVALID_USER_ID` when the ID is
            not a member of the workspace.
          schema:
            type: string
        - name: page
          in: query
          description: History page number. Values below 1 or non-numeric values become 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: History page size. Clamped to 1..100; non-numeric values become 25.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: source_type
          in: query
          description: |
            Optional income source classification to filter `history` by. Any
            other value is ignored without an error.
          schema:
            type: string
            enum: [active, passive, other]
        - name: category_id
          in: query
          description: |
            Optional income category ID (21-character nanoid) to filter `history`
            by. A value that is not a valid nanoid is ignored without an error.
          schema:
            type: string
        - name: _render
          in: query
          description: |
            Response format. `html` returns server-rendered partials for the web
            app and requires the header `X-Requested-With: XMLHttpRequest`;
            without it the request gets 403 with a JSON body
            `{ success: false, error: { message } }` and no code. API clients
            should omit this parameter.
          schema:
            type: string
            enum: [json, html]
            default: json
        - name: _partial
          in: query
          description: |
            Which partial(s) to render when using HTML format. Validated on every
            request (an unknown value returns 400 `INVALID_PARTIAL` even for JSON)
            but otherwise ignored for JSON.
            - summary: Income summary metrics cards
            - sources: Income by category table
            - members: Per-member income breakdown
            - history: Paginated income transaction history
            - selector: Report selector controls (only when requested by name; `all` does not include it)
            - all: summary, sources, members and history (default)
          schema:
            type: string
            enum: [summary, sources, members, history, selector, all]
            default: all
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '../schemas/IncomeReportResponse.yml#/IncomeReportResponse'
              example:
                success: true
                data:
                  summary:
                    totalIncome: "9750000"
                    activeIncome: "8250000"
                    passiveIncome: "1500000"
                    otherIncome: "0"
                    growthVsPreviousPeriod: "15.50"
                    previousPeriodLabel: "Feb 2026"
                  sourceMix:
                    - name: "Salary"
                      value: "7500000"
                      sourceType: "active"
                    - name: "Dividends"
                      value: "1500000"
                      sourceType: "passive"
                    - name: "Freelance"
                      value: "750000"
                      sourceType: "active"
                  sourceGroupTrend:
                    - name: "Mar"
                      active: "8250000"
                      passive: "1500000"
                      other: "0"
                  members:
                    - userId: "aBcD3fGh1jKlMn0pQrStU"
                      userName: "Alex"
                      totalIncome: "9750000"
                      transactionCount: 3
                  history:
                    transactions:
                      - id: "tXn4bC9dE2fG7hJ1kL3mN"
                        description: "Monthly Salary"
                        amount: "7500000"
                        currency: "IDR"
                        transaction_date: "2026-03-01T05:00:00.000Z"
                        category_name: "Salary"
                        category_icon: "banknote"
                        category_color: "bg-success"
                        income_source_type: "active"
                        created_by_name: "Alex"
                    total: 1
                    page: 1
                    pageSize: 25
                    appliedFilters: {}
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/reports/members:
    get:
      tags: [Reports]
      summary: Get member spending summary
      description: |
        Retrieve per-member income, expenses, net savings and transaction counts
        for a monthly or yearly period, across the whole workspace. JSON only.
        Amounts are decimal strings in the selected currency; only transactions
        recorded in that currency are counted.

        **Validation order:** `range`, `period`, `currency`. 400 codes:
        `INVALID_RANGE` (message "Invalid range. Must be 'monthly' or
        'yearly'."), `MISSING_PERIOD`, `INVALID_PERIOD` (every malformed or
        out-of-range period, unlike the other report routes), and
        `INVALID_CURRENCY`.
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: range
          in: query
          required: true
          description: Report range type
          schema:
            type: string
            enum: [monthly, yearly]
        - name: period
          in: query
          required: true
          description: |
            Period to summarize. Year must be 2000 to 2100.
            - For monthly: YYYY-MM with a two-digit month (e.g., "2026-03")
            - For yearly: YYYY (e.g., "2026")
          schema:
            type: string
            pattern: '^\d{4}(-\d{2})?$'
        - name: currency
          in: query
          description: |
            Currency to aggregate. Defaults to the workspace primary currency when
            omitted. Must be the workspace primary or secondary currency, otherwise
            400 `INVALID_CURRENCY`.
          schema:
            type: string
            enum: [IDR, USD, SGD, PHP, EUR, GBP, MYR, THB, JPY, AUD, KRW, INR]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '../schemas/MemberSummaryResponse.yml#/MemberSummaryResponse'
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/reports/category-drilldown:
    get:
      tags: [Reports]
      summary: Get category drill-down
      description: |
        List one category's transactions for a monthly or yearly period in one
        currency, newest first, with offset pagination. The web app uses it for
        the category detail modal, so several fields (`categoryName`,
        `categoryIcon`, `categoryColor`, `spent`, `budgetLimit`) are display
        values echoed from the query string rather than read from the database.

        Errors are always JSON, even with `_render=html`.

        **Validation order and 400 codes:** `categoryId` (`MISSING_CATEGORY_ID`,
        `INVALID_CATEGORY_ID`), `categoryName` (`MISSING_CATEGORY_NAME`),
        `range` (`INVALID_RANGE`), `period` present (`MISSING_PERIOD`),
        `currency` (`INVALID_CURRENCY` when missing or unsupported,
        `UNSUPPORTED_WORKSPACE_CURRENCY` when not a workspace currency), then
        `period` format (`INVALID_PERIOD_FORMAT`, `INVALID_MONTH`,
        `INVALID_YEAR`). 404 `CATEGORY_NOT_FOUND` when the category does not
        exist in the workspace.
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: categoryId
          in: query
          required: true
          description: Category ID, a 21-character nanoid
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{21}$'
          example: V1StGXR8_Z5jdHi6B-myT
        - name: categoryName
          in: query
          required: true
          description: Category name to echo back in `categoryName` and in each transaction's `category.name`. Not checked against the category.
          schema:
            type: string
          example: Groceries
        - name: range
          in: query
          required: true
          description: Report range type
          schema:
            type: string
            enum: [monthly, yearly]
          example: monthly
        - name: period
          in: query
          required: true
          description: |
            Period to list. Year must be 2000 to 2100.
            - For monthly: YYYY-MM with a two-digit month (e.g., "2026-03")
            - For yearly: YYYY (e.g., "2026")
          schema:
            type: string
            pattern: '^\d{4}(-\d{2})?$'
          example: "2026-03"
        - name: currency
          in: query
          required: true
          description: |
            Currency of the transactions to list. Required here, with no default.
            Must be the workspace primary or secondary currency.
          schema:
            type: string
            enum: [IDR, USD, SGD, PHP, EUR, GBP, MYR, THB, JPY, AUD, KRW, INR]
          example: IDR
        - name: categoryType
          in: query
          description: |
            Transaction type to list. Defaults to the category's own type. Not
            validated: any other value matches no transactions and is echoed in
            each transaction's `type`.
          schema:
            type: string
            enum: [expense, income]
        - name: limit
          in: query
          description: Page size. Clamped to 1..500; non-numeric values become 100.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          description: Number of transactions to skip. Negative values become 0; non-numeric values become 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: categoryIcon
          in: query
          description: Display only. Echoed in `categoryIcon`.
          schema:
            type: string
            default: tag
        - name: categoryColor
          in: query
          description: Display only. Echoed in `categoryColor`.
          schema:
            type: string
            default: bg-base-300
        - name: spent
          in: query
          description: Display only. Parsed as a number and echoed in `spent`; the server does not compute it.
          schema:
            type: number
            default: 0
        - name: budgetLimit
          in: query
          description: Display only. Parsed as a number and echoed in `budgetLimit`; null when omitted.
          schema:
            type: number
        - name: _render
          in: query
          description: |
            Response format. `html` returns the server-rendered modal body for the
            web app and requires the header `X-Requested-With: XMLHttpRequest`;
            without it the request gets 403 with a JSON body
            `{ success: false, error: { message } }` and no code. API clients
            should omit this parameter.
          schema:
            type: string
            enum: [json, html]
            default: json
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '../schemas/CategoryDrilldownResponse.yml#/CategoryDrilldownResponse'
            text/html:
              schema:
                type: string
                description: Server-rendered modal content (only for accepted `_render=html` requests)
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '404':
          $ref: '../responses/common.yml#/NotFound'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'
