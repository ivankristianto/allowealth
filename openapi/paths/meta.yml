# API description endpoints
paths:
  /api/openapi.json:
    get:
      tags: [Meta]
      summary: Get this OpenAPI document
      description: >-
        Returns this specification bundled into a single OpenAPI 3.1 JSON document (all `$ref`s
        local). Any authenticated caller may read it: a session cookie or an app password of
        either scope. Responses may be cached privately for 5 minutes.
      security:
        - sessionAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: The bundled OpenAPI document
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, max-age=300
          content:
            application/json:
              schema:
                type: object
                description: An OpenAPI 3.1 document
                required: [openapi, info, paths]
                properties:
                  openapi:
                    type: string
                    example: 3.1.0
                  info:
                    type: object
                  paths:
                    type: object
                  components:
                    type: object
                additionalProperties: true
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'
