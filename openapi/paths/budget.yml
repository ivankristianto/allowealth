# Budget endpoint paths
paths:
  /api/budget/overview:
    get:
      tags: [Budget]
      summary: Get budget overview
      description: |
        Budget versus spending for one month in one currency: totals plus one row per budget.
        Only budgets on active expense categories are included. Month bounds use the server's
        local time zone.

        Returns 400 with `Invalid year parameter`, `Invalid month parameter` or
        `Invalid currency parameter` (checked in that order). Values are read with `parseInt`,
        so trailing non-digits are ignored (`2026x` reads as 2026).

        `_render=html` returns server-rendered fragments for the web UI and needs the
        `X-Requested-With: XMLHttpRequest` header. API clients should use the JSON default.
      x-required-permission: budgets:read
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: year
          in: query
          description: Year, 2000-2100. Defaults to the current year.
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - name: month
          in: query
          description: Month, 1-12. Defaults to the current month.
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: currency
          in: query
          description: >-
            Currency code. Defaults to the workspace primary currency. Must be the workspace's
            primary or secondary currency (see GET /api/workspace/settings), otherwise 400.
          schema:
            type: string
            enum: [IDR, USD, SGD, PHP, EUR, GBP, MYR, THB, JPY, AUD, KRW, INR]
        - name: _render
          in: query
          description: >-
            Response format. `html` returns HTML fragments for the web UI and only works with
            the header `X-Requested-With: XMLHttpRequest`; without it the request gets 403.
          schema:
            type: string
            enum: [json, html]
            default: json
        - name: _partial
          in: query
          description: |
            Which fragments to render. Only used when `_render=html`.
            - summary: summary section, followed by the `copy-action` fragment
            - cards: card grid, followed by the `table` fragment and a `meta` JSON line
            - advice: advice banner
            - all: everything (default)
          schema:
            type: string
            enum: [summary, cards, advice, all]
            default: all
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '../schemas/BudgetOverviewResponse.yml#/BudgetOverviewResponse'
            text/html:
              schema:
                type: string
                description: |
                  Server-rendered HTML fragments, each prefixed with a marker comment such as
                  `<!-- PARTIAL:summary -->`. Markers: summary, copy-action, cards, table, advice,
                  meta (a JSON array of `{ id, budget_id, budget_amount }`).
                example: |
                  <!-- PARTIAL:summary -->
                  <section class="bg-base-100 rounded-card...">...</section>

                  <!-- PARTIAL:cards -->
                  <div class="grid grid-cols-1 md:grid-cols-2...">...</div>

                  <!-- PARTIAL:advice -->
                  <aside class="bg-info/5 border...">...</aside>
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/budget/history:
    get:
      tags: [Budget]
      summary: Get budget history
      description: |
        Monthly budget totals for the last `months` months, newest first, including the
        current month. Per-category rows are not included; use GET /api/budget/category-trends
        or GET /api/budget/overview for those.

        Returns 400 with `Invalid currency parameter`, `Invalid months parameter (must be 1-24)`
        or `Invalid year parameter`.

        `_render=html` returns a server-rendered table for the web UI and needs the
        `X-Requested-With: XMLHttpRequest` header. API clients should use the JSON default.
      x-required-permission: budgets:read
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: currency
          in: query
          description: >-
            Currency code. Defaults to the workspace primary currency. Must be the workspace's
            primary or secondary currency (see GET /api/workspace/settings), otherwise 400.
          schema:
            type: string
            enum: [IDR, USD, SGD, PHP, EUR, GBP, MYR, THB, JPY, AUD, KRW, INR]
        - name: months
          in: query
          description: Number of months back from the current month, 1-24. Defaults to 24.
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 24
        - name: year
          in: query
          description: >-
            Keep only months from this year (2000-2100). Applied after the `months` window, so
            months older than the window are never returned; the result can be empty.
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - name: _render
          in: query
          description: >-
            Response format. `html` returns an HTML table for the web UI and only works with the
            header `X-Requested-With: XMLHttpRequest`; without it the request gets 403.
          schema:
            type: string
            enum: [json, html]
            default: json
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '../schemas/BudgetHistoryResponse.yml#/BudgetHistoryResponse'
            text/html:
              schema:
                type: string
                description: Server-rendered HTML table fragment prefixed with `<!-- PARTIAL:table -->`.
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/budget/category-trends:
    get:
      tags: [Budget]
      summary: Get category trends
      description: |
        Category spending against budget across recent months, as a matrix of categories
        (rows) by months (columns, oldest first, ending with the current month). Rows are
        sorted by worst average budget adherence.

        Returns 400 with `Invalid currency parameter` or
        `Invalid months parameter (must be 3, 6, or 12)`.

        `_render=html` returns a server-rendered table for the web UI and needs the
        `X-Requested-With: XMLHttpRequest` header. API clients should use the JSON default.
      x-required-permission: budgets:read
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: currency
          in: query
          description: >-
            Currency code. Defaults to the workspace primary currency. Must be the workspace's
            primary or secondary currency (see GET /api/workspace/settings), otherwise 400.
          schema:
            type: string
            enum: [IDR, USD, SGD, PHP, EUR, GBP, MYR, THB, JPY, AUD, KRW, INR]
        - name: months
          in: query
          description: Number of months to include (3, 6 or 12). Any other value returns 400.
          schema:
            type: integer
            enum: [3, 6, 12]
            default: 6
        - name: _render
          in: query
          description: >-
            Response format. `html` returns an HTML table for the web UI and only works with the
            header `X-Requested-With: XMLHttpRequest`; without it the request gets 403.
          schema:
            type: string
            enum: [json, html]
            default: json
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '../schemas/BudgetCategoryTrendsResponse.yml#/BudgetCategoryTrendsResponse'
            text/html:
              schema:
                type: string
                description: Server-rendered HTML table fragment prefixed with `<!-- PARTIAL:table -->`.
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/budget/category/{id}/remaining:
    get:
      tags: [Budget]
      summary: Get category remaining budget
      description: |
        Budget, spending and remaining amount for one category in the current calendar month
        (server time). There is no month parameter. Works for any category in the workspace,
        including income or inactive ones; with no budget set, budget_amount is `"0"`.

        Returns 400 when `currency` is missing or not one of the workspace's currencies, and
        404 when the category does not exist in the workspace.
      x-required-permission: budgets:read
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '../parameters/common.yml#/IdParameter'
        - name: currency
          in: query
          required: true
          description: >-
            Currency code. Required. Must be the workspace's primary or secondary currency (see
            GET /api/workspace/settings), otherwise 400.
          schema:
            type: string
            enum: [IDR, USD, SGD, PHP, EUR, GBP, MYR, THB, JPY, AUD, KRW, INR]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '../schemas/CategoryRemainingResponse.yml#/CategoryRemainingResponse'
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '../schemas/ErrorResponse.yml#/ErrorResponse'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/budget/import:
    post:
      tags: [Budget]
      summary: Import budgets from CSV
      description: Import budgets from a CSV file with category and budget_amount columns
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [csv_file, month, year, currency]
              properties:
                csv_file:
                  type: string
                  format: binary
                  description: CSV file with "category" and "budget_amount" columns
                overwrite:
                  type: string
                  enum: ['true', 'false']
                  default: 'false'
                  description: Whether to overwrite existing budgets for the month
                month:
                  type: integer
                  minimum: 1
                  maximum: 12
                  description: Target month
                year:
                  type: integer
                  minimum: 2000
                  maximum: 2100
                  description: Target year
                currency:
                  type: string
                  enum: [IDR, USD, SGD, PHP, EUR, GBP, MYR, THB, JPY, AUD, KRW, INR]
                  description: Target currency
      responses:
        '200':
          description: Import completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      imported:
                        type: integer
                        description: Number of budgets imported
                      skipped:
                        type: integer
                        description: Number of budgets skipped (already exist)
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            row:
                              type: integer
                            message:
                              type: string
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/budget/export:
    get:
      tags: [Budget]
      summary: Export budget overview to CSV
      description: Export budget overview for a specific month to CSV file with category breakdowns.
      security:
        - sessionAuth: []
      parameters:
        - name: year
          in: query
          description: Year (defaults to current year)
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - name: month
          in: query
          description: Month (1-12, defaults to current month)
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: currency
          in: query
          description: Currency (defaults to IDR)
          schema:
            type: string
            enum: [IDR, USD, SGD, PHP, EUR, GBP, MYR, THB, JPY, AUD, KRW, INR]
            default: IDR
      responses:
        '200':
          description: CSV file generated successfully
          headers:
            Content-Type:
              description: CSV file content type
              schema:
                type: string
                example: text/csv; charset=utf-8
            Content-Disposition:
              description: File download attachment with filename
              schema:
                type: string
                example: 'attachment; filename="budget_2024_Jan.csv"'
          content:
            text/csv:
              schema:
                type: string
                example: |
                  category_name,budget_amount,expense_amount,balance,percentage,status
                  Food,5000000.00,3500000.00,1500000.00,70.0,ok
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'
