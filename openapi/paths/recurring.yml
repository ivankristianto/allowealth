paths:
  /api/recurring:
    get:
      tags: [Recurring]
      summary: List recurring templates
      description: >-
        Recurring templates for the workspace, newest first, paginated. Unknown `status` or
        `type` values are ignored (treated as no filter); bad `page`/`limit` fall back to defaults.
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by template status
          schema:
            type: string
            enum: [active, paused, completed, cancelled, all]
            default: all
        - name: type
          in: query
          description: Filter by template type
          schema:
            type: string
            enum: [expense, income]
        - name: search
          in: query
          description: Substring match on the template name
          schema:
            type: string
        - name: page
          in: query
          description: Page number (1-based)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Templates per page, capped at 100
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: _render
          in: query
          description: 'Browser-only. `html` returns a server-rendered partial and requires `X-Requested-With: XMLHttpRequest` (403 without it). Omit for JSON.'
          schema:
            type: string
            enum: [html]
      responses:
        '200':
          description: Recurring templates page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/ApiErrorResponse.yml#/ApiResponse'
                  - type: object
                    required: [success, data]
                    properties:
                      data:
                        type: object
                        required: [templates, total, page, limit]
                        properties:
                          templates:
                            type: array
                            items:
                              $ref: '../schemas/RecurringTemplate.yml#/RecurringTemplate'
                          total:
                            type: integer
                            description: Matching templates across all pages
                          page:
                            type: integer
                          limit:
                            type: integer
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'
    post:
      tags: [Recurring]
      summary: Create recurring template
      description: >-
        Create a recurring template and generate its pending occurrences. Requires
        `Content-Type: application/json` (415 otherwise). Unknown keys are rejected. The category
        must be an active category in the workspace and the account an open account (404
        `CATEGORY_NOT_FOUND` / `ACCOUNT_NOT_FOUND`, 400 `ACCOUNT_CLOSED`).
      security:
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: >-
                `day_of_month` is required when `frequency` is `monthly` (the default). Installments
                (`is_installment: true`) require `total_occurrences`. `starting_occurrence_number`
                must not exceed `total_occurrences`. Integer fields also accept numeric strings.
              required: [name, type, amount, currency, category_id, account_id, start_date]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                type:
                  type: string
                  enum: [expense, income]
                amount:
                  type: string
                  pattern: '^\d{1,15}(\.\d{1,2})?$'
                  description: Expected amount per occurrence, positive decimal as a string
                currency:
                  type: string
                  enum: [IDR, USD, SGD, PHP, EUR, GBP, MYR, THB, JPY, AUD, KRW, INR]
                category_id:
                  type: string
                  minLength: 1
                account_id:
                  type: string
                  minLength: 1
                frequency:
                  type: string
                  enum: [weekly, monthly]
                  default: monthly
                interval_count:
                  type: integer
                  minimum: 1
                  maximum: 52
                  default: 1
                  description: Repeat every N weeks or months
                day_of_month:
                  type: integer
                  minimum: 1
                  maximum: 31
                  description: >-
                    Due day for monthly templates, clamped to the last day in shorter months.
                    Ignored for weekly templates, which repeat on the weekday of `start_date`.
                start_date:
                  type: string
                  format: date
                  pattern: '^\d{4}-\d{2}-\d{2}$'
                end_date:
                  type: string
                  format: date
                  pattern: '^\d{4}-\d{2}-\d{2}$'
                total_occurrences:
                  type: integer
                  minimum: 1
                is_installment:
                  type: boolean
                  default: false
                  description: Also accepts the strings `true` and `false`
                installment_label:
                  type: string
                  maxLength: 100
                starting_occurrence_number:
                  type: integer
                  minimum: 1
                  default: 1
                description:
                  type: string
                  maxLength: 500
                status:
                  type: string
                  enum: [active, paused, completed, cancelled]
                  default: active
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/ApiErrorResponse.yml#/ApiResponse'
                  - type: object
                    required: [success, data]
                    properties:
                      data:
                        $ref: '../schemas/RecurringTemplate.yml#/RecurringTemplate'
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '404':
          $ref: '../responses/common.yml#/NotFound'
        '415':
          $ref: '../responses/common.yml#/UnsupportedMediaType'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/recurring/{id}:
    get:
      tags: [Recurring]
      summary: Get recurring template by ID
      description: A recurring template plus all its occurrences, newest due date first
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '../parameters/common.yml#/IdParameter'
      responses:
        '200':
          description: Recurring template detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/ApiErrorResponse.yml#/ApiResponse'
                  - type: object
                    required: [success, data]
                    properties:
                      data:
                        allOf:
                          - $ref: '../schemas/RecurringTemplate.yml#/RecurringTemplate'
                          - type: object
                            required: [occurrences]
                            properties:
                              occurrences:
                                type: array
                                items:
                                  $ref: '../schemas/RecurringOccurrence.yml#/RecurringOccurrence'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '404':
          $ref: '../responses/common.yml#/NotFound'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'
    put:
      tags: [Recurring]
      summary: Update recurring template
      description: >-
        Partial update; send only the fields to change. Requires `Content-Type: application/json`
        (415 otherwise). Unknown keys are rejected, including `status`. Status changes go through
        the pause, resume and cancel endpoints, which accept only a session (not app passwords).
        Integer fields also accept numeric strings.
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '../parameters/common.yml#/IdParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                type:
                  type: string
                  enum: [expense, income]
                amount:
                  type: string
                  pattern: '^\d{1,15}(\.\d{1,2})?$'
                currency:
                  type: string
                  enum: [IDR, USD, SGD, PHP, EUR, GBP, MYR, THB, JPY, AUD, KRW, INR]
                category_id:
                  type: string
                  minLength: 1
                account_id:
                  type: string
                  minLength: 1
                frequency:
                  type: string
                  enum: [weekly, monthly]
                interval_count:
                  type: integer
                  minimum: 1
                  maximum: 52
                day_of_month:
                  type: integer
                  minimum: 1
                  maximum: 31
                start_date:
                  type: string
                  format: date
                  pattern: '^\d{4}-\d{2}-\d{2}$'
                end_date:
                  type: string
                  format: date
                  pattern: '^\d{4}-\d{2}-\d{2}$'
                  nullable: true
                  description: Send `null` to remove the end date
                total_occurrences:
                  type: integer
                  minimum: 1
                  nullable: true
                is_installment:
                  type: boolean
                  description: Also accepts the strings `true` and `false`
                installment_label:
                  type: string
                  maxLength: 100
                  nullable: true
                starting_occurrence_number:
                  type: integer
                  minimum: 1
                description:
                  type: string
                  maxLength: 500
                  nullable: true
      responses:
        '200':
          description: Template updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/ApiErrorResponse.yml#/ApiResponse'
                  - type: object
                    required: [success, data]
                    properties:
                      data:
                        $ref: '../schemas/RecurringTemplate.yml#/RecurringTemplate'
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '404':
          $ref: '../responses/common.yml#/NotFound'
        '415':
          $ref: '../responses/common.yml#/UnsupportedMediaType'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

    delete:
      tags: [Recurring]
      summary: Delete recurring template
      description: Permanently delete a recurring template and cascaded occurrences
      security:
        - sessionAuth: []
      parameters:
        - $ref: '../parameters/common.yml#/IdParameter'
      responses:
        '204':
          description: Template deleted successfully
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '404':
          $ref: '../responses/common.yml#/NotFound'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/recurring/{id}/pause:
    post:
      tags: [Recurring]
      summary: Pause recurring template
      description: Set recurring template status to paused
      security:
        - sessionAuth: []
      parameters:
        - $ref: '../parameters/common.yml#/IdParameter'
      responses:
        '200':
          description: Template paused
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/ApiErrorResponse.yml#/ApiResponse'
                  - type: object
                    required: [success, data]
                    properties:
                      data:
                        $ref: '../schemas/RecurringTemplate.yml#/RecurringTemplate'
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '404':
          $ref: '../responses/common.yml#/NotFound'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/recurring/{id}/resume:
    post:
      tags: [Recurring]
      summary: Resume recurring template
      description: Set recurring template status back to active
      security:
        - sessionAuth: []
      parameters:
        - $ref: '../parameters/common.yml#/IdParameter'
      responses:
        '200':
          description: Template resumed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/ApiErrorResponse.yml#/ApiResponse'
                  - type: object
                    required: [success, data]
                    properties:
                      data:
                        $ref: '../schemas/RecurringTemplate.yml#/RecurringTemplate'
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '404':
          $ref: '../responses/common.yml#/NotFound'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/recurring/{id}/cancel:
    post:
      tags: [Recurring]
      summary: Cancel recurring template
      description: Cancel a recurring template and remove future pending occurrences
      security:
        - sessionAuth: []
      parameters:
        - $ref: '../parameters/common.yml#/IdParameter'
      responses:
        '200':
          description: Template cancelled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/ApiErrorResponse.yml#/ApiResponse'
                  - type: object
                    required: [success, data]
                    properties:
                      data:
                        $ref: '../schemas/RecurringTemplate.yml#/RecurringTemplate'
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '404':
          $ref: '../responses/common.yml#/NotFound'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/recurring/occurrences:
    get:
      tags: [Recurring]
      summary: List recurring occurrences
      description: >-
        Occurrences for one window of due dates, ordered by due date.


        - Default window: the whole calendar month given by `month` (first to last day), or the
        current UTC month when `month` is omitted or malformed.

        - `due_within=Nd` (e.g. `7d`) replaces the month window with today through today plus N
        days (UTC dates, inclusive). `month` is then ignored. Values not matching `^\d+d$` are
        silently ignored and the month window applies.


        There is no window that reaches back before today across months: to find pending
        occurrences that are overdue from earlier months, query each earlier `month` with
        `status=pending`. Pending occurrences of templates that are not active are left out.
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          description: Calendar month, YYYY-MM. Defaults to the current UTC month.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
            example: '2026-03'
        - name: status
          in: query
          description: Filter by occurrence status. Omitted or unknown values mean `all`.
          schema:
            type: string
            enum: [pending, confirmed, skipped, all]
            default: all
        - name: due_within
          in: query
          description: >-
            `Nd` limits results to due dates from today to today plus N days (inclusive, UTC) and
            overrides `month`. `0d` means due today. Plain numbers such as `7` are ignored.
          schema:
            type: string
            pattern: '^\d+d$'
            example: 7d
        - name: _render
          in: query
          description: 'Browser-only. `html` returns a server-rendered partial and requires `X-Requested-With: XMLHttpRequest` (403 without it). Omit for JSON.'
          schema:
            type: string
            enum: [html]
      responses:
        '200':
          description: Recurring occurrences
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/ApiErrorResponse.yml#/ApiResponse'
                  - type: object
                    required: [success, data]
                    properties:
                      data:
                        type: object
                        required: [occurrences, total]
                        properties:
                          occurrences:
                            type: array
                            items:
                              $ref: '../schemas/RecurringOccurrence.yml#/RecurringOccurrence'
                          total:
                            type: integer
                            description: Length of `occurrences` (the list is not paginated)
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/recurring/occurrences/{id}/confirm:
    post:
      tags: [Recurring]
      summary: Confirm recurring occurrence
      description: >-
        Mark a pending occurrence as confirmed and create the matching transaction (type and
        currency come from the template). Requires `Content-Type: application/json` (415
        otherwise). The occurrence must be pending, its template active, and its due date today
        or earlier. Conflicts return 409 with code `OCCURRENCE_NOT_DUE`,
        `OCCURRENCE_ALREADY_CONFIRMED`, `OCCURRENCE_ALREADY_SKIPPED` or `TEMPLATE_NOT_ACTIVE`.
        An unknown occurrence returns 404 `RECURRING_OCCURRENCE_NOT_FOUND`.
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '../parameters/common.yml#/IdParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/ConfirmOccurrenceRequest.yml#/ConfirmOccurrenceRequest'
      responses:
        '201':
          description: Occurrence confirmed; `data` is the created transaction
          content:
            application/json:
              schema:
                $ref: '../schemas/ConfirmOccurrenceResponse.yml#/ConfirmOccurrenceResponse'
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '404':
          $ref: '../responses/common.yml#/NotFound'
        '409':
          description: Occurrence not due yet, already confirmed or skipped, or template not active
          content:
            application/json:
              schema:
                $ref: '../schemas/ErrorResponse.yml#/ErrorResponse'
              example:
                success: false
                error:
                  message: You can only confirm or skip an occurrence on or after its due date
                  code: OCCURRENCE_NOT_DUE
        '415':
          $ref: '../responses/common.yml#/UnsupportedMediaType'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/recurring/occurrences/{id}/skip:
    post:
      tags: [Recurring]
      summary: Skip recurring occurrence
      description: Mark an occurrence as skipped with an optional reason
      security:
        - sessionAuth: []
      parameters:
        - $ref: '../parameters/common.yml#/IdParameter'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                skip_reason:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: Occurrence skipped
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/ApiErrorResponse.yml#/ApiResponse'
                  - type: object
                    required: [success, data]
                    properties:
                      data:
                        $ref: '../schemas/RecurringOccurrence.yml#/RecurringOccurrence'
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '404':
          $ref: '../responses/common.yml#/NotFound'
        '409':
          description: Occurrence already confirmed/skipped
          content:
            application/json:
              schema:
                $ref: '../schemas/ErrorResponse.yml#/ErrorResponse'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/recurring/calendar:
    get:
      tags: [Recurring]
      summary: Get recurring calendar data
      description: >-
        All occurrences (any status, any template status) due in one calendar month, grouped by
        due date. Days without occurrences are omitted. Out-of-range or missing `year`/`month`
        fall back to the current year and month.
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: year
          in: query
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - name: month
          in: query
          description: Month number, 1-12
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: _render
          in: query
          description: 'Browser-only. `html` returns a server-rendered partial and requires `X-Requested-With: XMLHttpRequest` (403 without it). Omit for JSON.'
          schema:
            type: string
            enum: [html]
      responses:
        '200':
          description: Calendar days, ascending by date
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/ApiErrorResponse.yml#/ApiResponse'
                  - type: object
                    required: [success, data]
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          required: [date, occurrences]
                          properties:
                            date:
                              type: string
                              format: date
                            occurrences:
                              type: array
                              items:
                                $ref: '../schemas/RecurringOccurrence.yml#/RecurringOccurrence'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/recurring/forecast:
    get:
      tags: [Recurring]
      summary: Get recurring cash-flow forecast
      description: >-
        Projects each matching template's amount onto its due dates for the next `monthCount`
        months, starting with the current UTC month. Projections come from template schedules,
        not from stored occurrences, so confirmed or skipped occurrences do not change them.
        Invalid filter values fall back to defaults.
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: monthCount
          in: query
          description: Number of months to project. Any other value means 12.
          schema:
            type: integer
            enum: [3, 6, 12, 24]
            default: 12
        - name: type
          in: query
          description: Only income or only expense templates
          schema:
            type: string
            enum: [expense, income]
        - name: status
          in: query
          description: Template status. `all` means active and paused. Unknown values mean `active`.
          schema:
            type: string
            enum: [active, paused, all]
            default: active
        - name: accounts
          in: query
          description: >-
            Account IDs to include, comma-separated or repeated (`accounts=a&accounts=b`). Up to
            50 IDs; malformed IDs are dropped.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Forecast
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/ApiErrorResponse.yml#/ApiResponse'
                  - type: object
                    required: [success, data]
                    properties:
                      data:
                        $ref: '../schemas/RecurringForecast.yml#/RecurringForecast'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/recurring/stats:
    get:
      tags: [Recurring]
      summary: Get recurring stats
      description: >-
        Counts for the current UTC calendar month only. `pendingCount` and `pendingByCurrency`
        cover pending occurrences of active templates due this month; `overdueCount` is the subset
        due before today (earlier months are not counted); `confirmedThisMonth` counts occurrences
        due this month that were confirmed. The `month` parameter affects only the HTML partial.
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          description: YYYY-MM. Used only with `_render=html`; JSON always reports the current month.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
        - name: _render
          in: query
          description: 'Browser-only. `html` returns a server-rendered partial and requires `X-Requested-With: XMLHttpRequest` (403 without it). Omit for JSON.'
          schema:
            type: string
            enum: [html]
      responses:
        '200':
          description: Recurring stats
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/ApiErrorResponse.yml#/ApiResponse'
                  - type: object
                    required: [success, data]
                    properties:
                      data:
                        $ref: '../schemas/RecurringStats.yml#/RecurringStats'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'
