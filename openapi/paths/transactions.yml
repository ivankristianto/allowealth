# Transactions endpoint paths
paths:
  /api/transactions:
    get:
      tags: [Transactions]
      summary: List transactions
      description: >-
        Paginated list of the workspace's transactions, newest first (by transaction date, then
        creation time). Soft-deleted transactions are excluded. When both `start_date` and
        `end_date` are sent, `data.summary` adds income and expense totals for that range.
        Invalid `type` values are ignored; `limit` and `offset` are clamped, not rejected.
      x-required-permission: transactions:read
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          description: Filter by type. Only `expense` and `income` are honored; any other value (including `transfer`) is ignored.
          schema:
            type: string
            enum: [expense, income]
        - name: category_id
          in: query
          description: Filter by one category ID
          schema:
            type: string
        - name: category_ids
          in: query
          description: Filter by several category IDs, comma-separated
          schema:
            type: string
            example: catA,catB
        - name: account_id
          in: query
          description: Filter by source account ID
          schema:
            type: string
        - name: account_ids
          in: query
          description: Filter by several source account IDs, comma-separated
          schema:
            type: string
            example: accA,accB
        - name: user_id
          in: query
          description: Only transactions created by this workspace member
          schema:
            type: string
        - name: currency
          in: query
          description: >-
            Filter by currency. Must be the workspace's primary or secondary currency, otherwise
            the request fails with 400 `Invalid currency parameter`.
          schema:
            type: string
            enum: [IDR, USD, SGD, PHP, EUR, GBP, MYR, THB, JPY, AUD, KRW, INR]
        - name: start_date
          in: query
          description: Inclusive lower bound, YYYY-MM-DD (any string `new Date()` parses). 400 if unparseable.
          schema:
            type: string
            format: date
            example: '2026-03-01'
        - name: end_date
          in: query
          description: >-
            Upper bound, YYYY-MM-DD, compared as midnight UTC. Transactions created through this
            API are stored at midnight UTC, so the day itself is included. 400 if unparseable.
          schema:
            type: string
            format: date
            example: '2026-03-31'
        - name: search
          in: query
          description: Substring match on the description (SQL LIKE, case-insensitive for ASCII letters)
          schema:
            type: string
        - name: limit
          in: query
          description: Page size, clamped to 1-100
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          description: Number of results to skip, clamped to 0 or more
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: _render
          in: query
          description: 'Browser-only. `html` returns server-rendered partials and requires `X-Requested-With: XMLHttpRequest` (403 without it). Omit for JSON.'
          schema:
            type: string
            enum: [html]
      responses:
        '200':
          description: Transactions page
          content:
            application/json:
              schema:
                $ref: '../schemas/TransactionsListResponse.yml#/TransactionsListResponse'
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'
    post:
      tags: [Transactions]
      summary: Create a transaction
      description: >-
        Create an expense, income or transfer. Requires `Content-Type: application/json`
        (415 `UNSUPPORTED_MEDIA_TYPE` otherwise). An unknown category or account returns 404
        (`CATEGORY_NOT_FOUND`, `ACCOUNT_NOT_FOUND`); an inactive category, a closed account or a
        currency that differs from the account's returns 400 (`CATEGORY_INACTIVE`,
        `ACCOUNT_CLOSED`, `VALIDATION_ERROR`). `transaction_date` may not be later than today in
        the workspace timezone.
      x-required-permission: transactions:create
      security:
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/CreateTransactionRequest.yml#/CreateTransactionRequest'
            examples:
              expense:
                summary: Expense
                value:
                  type: expense
                  amount: '45000'
                  currency: IDR
                  category_id: catFood0000000000000
                  account_id: accCash0000000000000
                  transaction_date: '2026-03-10'
                  description: Lunch
              transfer:
                summary: Transfer between accounts
                value:
                  type: transfer
                  amount: '500000'
                  currency: IDR
                  account_id: accBank0000000000000
                  to_account_id: accCash0000000000000
                  transaction_date: '2026-03-10'
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '../schemas/TransactionResponse.yml#/TransactionResponse'
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '404':
          $ref: '../responses/common.yml#/NotFound'
        '415':
          $ref: '../responses/common.yml#/UnsupportedMediaType'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/transactions/{id}:
    get:
      tags: [Transactions]
      summary: Get a transaction
      description: >-
        One transaction by ID. Soft-deleted transactions return 404. `has_history`,
        `is_recurring` and `created_by_user_name` are not computed here (see Transaction).
      x-required-permission: transactions:read
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '../parameters/common.yml#/IdParameter'
      responses:
        '200':
          description: The transaction
          content:
            application/json:
              schema:
                $ref: '../schemas/TransactionResponse.yml#/TransactionResponse'
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '404':
          $ref: '../responses/common.yml#/NotFound'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'
    put:
      tags: [Transactions]
      summary: Update a transaction
      description: >-
        Partial update: send only the fields to change. Requires `Content-Type: application/json`
        (415 otherwise). Writes an audit history entry.
      x-required-permission: transactions:update
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '../parameters/common.yml#/IdParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/UpdateTransactionRequest.yml#/UpdateTransactionRequest'
      responses:
        '200':
          description: Transaction updated
          content:
            application/json:
              schema:
                $ref: '../schemas/TransactionResponse.yml#/TransactionResponse'
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '404':
          $ref: '../responses/common.yml#/NotFound'
        '415':
          $ref: '../responses/common.yml#/UnsupportedMediaType'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'
    delete:
      tags: [Transactions]
      summary: Delete a transaction
      description: Soft delete. The row is kept with `deleted_at` set and no longer appears in lists or lookups.
      x-required-permission: transactions:delete
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '../parameters/common.yml#/IdParameter'
      responses:
        '200':
          description: Transaction deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/ApiErrorResponse.yml#/ApiResponse'
                  - type: object
                    required: [success, data]
                    properties:
                      data:
                        type: object
                        required: [message]
                        properties:
                          message:
                            type: string
                            example: Transaction deleted successfully
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '404':
          $ref: '../responses/common.yml#/NotFound'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/transactions/{id}/history:
    get:
      tags: [Transactions]
      summary: Get transaction audit history
      description: >-
        Create, update and delete audit events for a transaction, oldest first. By default only
        the latest 5 updates are included; `all=true` returns every update. An unknown ID returns
        an empty history, not 404.
      x-required-permission: transactions:read
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '../parameters/common.yml#/IdParameter'
        - name: all
          in: query
          description: '`true` returns every update event. Any other value means the default (latest 5).'
          schema:
            type: string
            enum: ['true', 'false']
        - name: _render
          in: query
          description: 'Browser-only. `html` returns a server-rendered partial and requires `X-Requested-With: XMLHttpRequest` (403 without it). Omit for JSON.'
          schema:
            type: string
            enum: [html]
      responses:
        '200':
          description: Audit history
          content:
            application/json:
              schema:
                $ref: '../schemas/TransactionHistoryResponse.yml#/TransactionHistoryResponse'
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '403':
          $ref: '../responses/common.yml#/Forbidden'
        '429':
          $ref: '../responses/common.yml#/TooManyRequests'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/transactions/export:
    get:
      tags: [Transactions]
      summary: Export transactions to CSV
      description: Export transactions to CSV file with optional filters. Returns a downloadable CSV file with all matching transactions.
      security:
        - sessionAuth: []
      parameters:
        - name: type
          in: query
          description: Filter by transaction type
          schema:
            type: string
            enum: [expense, income]
        - name: category_id
          in: query
          description: Filter by category ID
          schema:
            type: string
        - name: payment_method_id
          in: query
          description: Filter by payment method ID
          schema:
            type: string
        - name: currency
          in: query
          description: Filter by currency
          schema:
            type: string
            enum: [IDR, USD, SGD, PHP, EUR, GBP, MYR, THB, JPY, AUD, KRW, INR]
        - name: start_date
          in: query
          description: Filter by start date (ISO 8601)
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          description: Filter by end date (ISO 8601)
          schema:
            type: string
            format: date
        - name: search
          in: query
          description: Search in transaction description
          schema:
            type: string
      responses:
        '200':
          description: CSV file generated successfully
          headers:
            Content-Type:
              description: CSV file content type
              schema:
                type: string
                example: text/csv; charset=utf-8
            Content-Disposition:
              description: File download attachment with filename
              schema:
                type: string
                example: 'attachment; filename="transactions_2024-01-15.csv"'
          content:
            text/csv:
              schema:
                type: string
                example: |
                  date,type,amount,currency,category,payment_method,description
                  2024-01-15,expense,50.00,IDR,Food,Cash,Lunch
        '400':
          $ref: '../responses/common.yml#/BadRequest'
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'

  /api/transactions/import:
    post:
      tags: [Transactions]
      summary: Import transactions from CSV
      description: |
        Import transactions from a CSV file with custom column mapping.

        **CSV Format Requirements:**
        - Must be a valid CSV file with headers
        - Must contain at least one data row
        - Supports quoted fields and escaped quotes

        **Column Mapping:**
        The endpoint accepts column mapping parameters to map CSV columns to database fields:
        - `map_date`: Date column (YYYY-MM-DD format)
        - `map_type`: Type column (expense/income)
        - `map_amount`: Amount column (numeric value)
        - `map_currency`: Currency column (e.g., IDR, USD, SGD, EUR)
        - `map_category`: Category column (category name)
        - `map_payment_method`: Payment method column (payment method name)
        - `map_description`: Description column (optional notes)

        **Import Result:**
        Returns counts of successfully imported transactions, skipped transactions,
        and validation errors for failed rows.
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - csv_file
              properties:
                csv_file:
                  type: string
                  format: binary
                  description: CSV file to import
                map_date:
                  type: string
                  description: CSV column name for date field
                  example: date
                map_type:
                  type: string
                  description: CSV column name for type field
                  example: type
                map_amount:
                  type: string
                  description: CSV column name for amount field
                  example: amount
                map_currency:
                  type: string
                  description: CSV column name for currency field
                  example: currency
                map_category:
                  type: string
                  description: CSV column name for category field
                  example: category
                map_payment_method:
                  type: string
                  description: CSV column name for payment method field
                  example: payment_method
                map_description:
                  type: string
                  description: CSV column name for description field
                  example: description
      responses:
        '200':
          description: Import completed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/ApiErrorResponse.yml#/ApiResponse'
                  - type: object
                    required: [success, data]
                    properties:
                      success:
                        type: boolean
                        example: true
                      data:
                        type: object
                        required: [message, result]
                        properties:
                          message:
                            type: string
                            example: Import completed
                          result:
                            $ref: '../schemas/TransactionImportResult.yml#/TransactionImportResult'
        '400':
          description: Bad request - invalid CSV or mapping
          content:
            application/json:
              schema:
                $ref: '../schemas/ErrorResponse.yml#/ErrorResponse'
              examples:
                missingFile:
                  summary: CSV file not provided
                  value:
                    success: false
                    error:
                      message: CSV file is required
                      code: INVALID_INPUT
                invalidFormat:
                  summary: Not a CSV file
                  value:
                    success: false
                    error:
                      message: File must be a CSV
                      code: INVALID_INPUT
                emptyFile:
                  summary: CSV file has no data
                  value:
                    success: false
                    error:
                      message: CSV file must contain at least a header row and one data row
                      code: INVALID_INPUT
        '401':
          $ref: '../responses/common.yml#/Unauthorized'
        '500':
          $ref: '../responses/common.yml#/InternalServerError'
