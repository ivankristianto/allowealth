name: E2E Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node_modules
            .bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Create E2E environment file
        run: |
          cp .env.example .env.e2e
          sed -i 's|DATABASE_URL=db/.dev.db|DATABASE_URL=db/.e2e.db|g' .env.e2e
          sed -i 's|PORT=4321|PORT=4320|g' .env.e2e
          echo "" >> .env.e2e
          echo "E2E_USER_EMAIL=demo@example.com" >> .env.e2e
          echo "E2E_USER_PASSWORD=demo123456789" >> .env.e2e
          cp .env.e2e .env

      - name: Setup E2E database
        run: |
          mkdir -p db
          bun run db:migrate
          bun run db:seed --yes

      # The config builds the app and serves dist/ with bun --bun, as the Docker image does
      - name: Run E2E tests against the production build
        run: npx playwright test --config=e2e/playwright.config.ts
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: test-results/playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: test-screenshots
          path: test-results/artifacts/
          retention-days: 7
