version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # The bun ecosystem updates bun.lock; npm would only touch package.json
  - package-ecosystem: bun
    directories:
      - /
      - /apps/docs
      - /apps/mcp
      - /apps/site
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      bun-minor-patch:
        update-types: [minor, patch]
